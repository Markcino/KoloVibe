# FFmpeg (history): the 14 November exception (CVE-2026-107696) and the 19 November second set (29 CVEs) matched only
# FFmpeg 9.0.2/9.1-r0 components that the minimal build does not contain. After the move to FFmpeg 9.1 (25 November),
