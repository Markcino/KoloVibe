# The scan gate (anchore/scan-action: fail-build true, severity-cutoff high) is unchanged. This file holds the ONE
# exception the owner approved on 14 November 2026 (decision "Minimal 9.0.2 build + exception"), plus the
# separately approved and separately evidenced second set described below.
#
# CVE-2026-107696: FFmpeg through 9.0.2 loops forever in ff_rtsp_connect() on endless RTSP 3xx redirects. 9.0.2 is the
# newest upstream release and no fixed release exists. The media-worker image builds FFmpeg 9.0.2 with every network
# protocol compiled out (infra/docker/ffmpeg/APKBUILD), so the RTSP code is not in the binary: CI proves it on every
# build (the "Verify FFmpeg is the minimal build" step fails if ffmpeg lists rtsp, rtp, http, tcp, udp or tls, or any
# protocol but file and pipe), and the encoder additionally runs with -protocol_whitelist file,pipe.
#
# The rule matches only this CVE on the apk package `ffmpeg` at exactly version 9.1-r0 (9.0.2-r0 until 25 November). A different FFmpeg version,
# any other CVE, and every other package stay fully gated, and the shared image has no ffmpeg package at all.
# It expires: scripts/test_shared_service_image.py fails after the date below so the exception is reviewed or removed.
# Expires: 2027-02-12
# Second set (19 November 2026): 29 High findings published that day against FFmpeg 9.0.2, which has no fixed release. The
# owner approved scoped, expiring exceptions only where the vulnerable component is NOT built into the minimal FFmpeg
# (--disable-everything, no hardware acceleration, no optional libraries, only the decoders, encoders and filters the
# pipeline needs). Every rule below is listed with its component in infra/docker/ffmpeg/scan-exceptions.json; CI checks
# each premise against the built binary on every build, and scripts/test_ffmpeg_scan_exceptions.py keeps this file and
# that evidence identical. The rules match only apk `ffmpeg` at exactly 9.1-r0 (was 9.0.2-r0): a different version, any other CVE
# and every other package stay fully gated, so new findings in the same batch fail the scan until they are triaged.
# Expires (second set): 2026-12-31
# TEMPORARY OpenSSL scan exception (owner-authorized 2026-11-21; EXPIRES 2026-11-28 UTC).
# Scope: exactly five CVEs, only Alpine apk libssl3/libcrypto3 version 3.5.9-r1.
# Exposure: these libraries provide TLS/cryptography to the shared service, web and media images.
# They are reachable through legitimate TLS operations; there is NO claim that vulnerable code is
# absent or that these CVEs are unexploitable. Scanning evidence at 2026-11-21 identifies High
# findings without fixed Alpine package versions in this release. Residual risk is accepted
# temporarily for restricted staging review; remove the exceptions as soon as patched packages
# are available. No additional High/Critical findings are waived. Deployment still requires
# independent security review and successful staging controls.
# Expires (OpenSSL temporary): 2026-11-28
# Version move (25 November 2026): FFmpeg 9.0.2 -> 9.1, the upstream fix for the 24 November advisories
# CVE-2026-135722 to -135743 (11 High/Critical, including the scale filter and the WAV muxer this build contains).
# The ffmpeg rules above now match exactly 9.1-r0. Their premise is unchanged and version-independent (the component
# is not compiled in) and CI re-checks it against the 9.1 binary on every build. Rules whose CVE 9.1 fixes match
# nothing and are to be pruned once the scan shows which still apply. Owner review of this move is pending.
ignore:
  - vulnerability: CVE-2026-107696
    package:
      name: ffmpeg
      version: 9.1-r0
      type: apk
