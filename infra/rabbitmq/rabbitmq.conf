# Review against the exact selected RabbitMQ DHI digest before deployment.
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/secrets/kolovibe_rmq_ca
ssl_options.certfile = /run/secrets/kolovibe_rmq_cert
ssl_options.keyfile = /run/secrets/kolovibe_rmq_key
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
loopback_users.guest = true
# A secured, separately provisioned definitions file supplies service users,
# vhosts, permission-scoped accounts and dead-letter queue bindings.
definitions.import_backend = local_filesystem
definitions.local.path = /run/secrets/kolovibe_rmq_definitions
