      placement:
        constraints: ["node.labels.kolovibe.workloads == true", "node.labels.kolovibe.rabbitmq == true"]
      restart_policy: {condition: on-failure}
      resources:
        limits:
          memory: ${RABBITMQ_MEMORY_LIMIT:?approved capacity-tested RabbitMQ memory limit required}
          cpus: "1.0"

networks:
