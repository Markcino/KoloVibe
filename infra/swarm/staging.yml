version: "3.8"
# Candidate only: all replicas stay zero until capacity, secrets and release approvals.
# PLACEMENT PROFILE: oracle-staging only. The `node.labels.kolovibe.*` constraints below match the
# labelled Oracle VM2. The AWS staging nodes carry no Swarm labels, so this file would leave every
# service unschedulable there; AWS services are placed by `node.hostname==<worker>` through the
# aws-staging profile of scripts/ops/kolovibe_cluster.py. Do not `docker stack deploy` this file on AWS.

x-environment: &environment
  KOLOVIBE_ENV: staging
  DJANGO_DEBUG: "0"
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_key
  KOLOVIBE_DB_NAME: ${STAGING_DB_NAME:?approved staging database required}
  KOLOVIBE_DB_HOST: ${STAGING_DB_HOST:?verified TLS database host required}
  KOLOVIBE_DB_PORT: "5432"
  KOLOVIBE_DB_PASSWORD_FILE: /run/secrets/db_password
  KOLOVIBE_DB_SSLROOTCERT: /run/secrets/db_ca
  KOLOVIBE_INTERNAL_CA_FILE: /run/secrets/internal_ca
  KOLOVIBE_TLS_CERT_FILE: /run/secrets/tls_cert
  KOLOVIBE_TLS_KEY_FILE: /run/secrets/tls_key
  KOLOVIBE_CALLER_KEYS_FILE: /run/secrets/caller_keys
  KOLOVIBE_PROBE_TOKEN_FILE: /run/secrets/probe_token
  KOLOVIBE_STAGING_ACCOUNTS: "0"
  KOLOVIBE_STAGING_PRIVILEGED: "0"

x-deploy: &deploy
  replicas: 0
  # Only the labeled VM2 worker may run KoloVibe Django services.
  placement:
    constraints: ["node.labels.kolovibe.workloads == true"]
  resources:
    limits:
      cpus: "1.0"
      memory: ${API_MEMORY_LIMIT:?approved per-API memory limit required}
    reservations:
      cpus: "0.25"
      memory: ${API_MEMORY_RESERVATION:?approved per-API memory reservation required}
  update_config:
    parallelism: 1
    order: stop-first
    failure_action: rollback
    monitor: 30s
  rollback_config: {parallelism: 1, order: stop-first, monitor: 30s}
  restart_policy: {condition: on-failure, delay: 5s, max_attempts: 3}

x-health: &health
  test: ["CMD", "python", "-m", "staging_runtime.probe"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

x-api: &api
  image: ${KOLOVIBE_IMAGE:?verified shared GHCR digest required}
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp"]
  networks: [private, data_private]
  healthcheck: *health
  deploy: *deploy

services:
  gateway:
    image: ${KOLOVIBE_IMAGE:?verified shared GHCR digest required}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [private, data_private]
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: gateway
      KOLOVIBE_ALLOWED_HOSTS: ${GATEWAY_HOSTS:?approved gateway hostnames required}
      # Host Nginx overwrites this header on every request with the client address it recovered from
      # the Cloudflare Tunnel connector (infra/nginx). Without it every per-origin limit is inert (D12-001).
      KOLOVIBE_TRUSTED_CLIENT_IP_HEADER: CF-Connecting-IP
      KOLOVIBE_DB_USER: ${GATEWAY_DB_USER:?runtime database login required}
      KOLOVIBE_TRUSTED_PEERS_FILE: /run/secrets/trusted_peers
      # JSON map {audience: key}: one independent signing key per peer. Each peer's
      # `<peer>_callers` secret holds only its own {"gateway": key}; see README rotation steps.
      KOLOVIBE_OUTBOUND_KEY_FILE: /run/secrets/outbound_key
    secrets:
      - {source: gateway_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: gateway_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: gateway_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: gateway_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: gateway_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: gateway_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: trusted_peers, target: trusted_peers, uid: "10001", gid: "10001", mode: 0400}
      - {source: gateway_outbound, target: outbound_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
    healthcheck: *health
    deploy: *deploy
  content:
    image: ${KOLOVIBE_IMAGE:?verified shared GHCR digest required}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [private, data_private]
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: content
      KOLOVIBE_ALLOWED_HOSTS: content
      KOLOVIBE_DB_USER: ${CONTENT_DB_USER:?runtime database login required}
    secrets:
      - {source: content_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: content_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: content_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: content_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: content_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: content_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
    healthcheck: *health
    deploy: *deploy
  creators:
    image: ${KOLOVIBE_IMAGE:?verified shared GHCR digest required}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp"]
    networks: [private, data_private]
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: creators
      KOLOVIBE_ALLOWED_HOSTS: creators
      KOLOVIBE_DB_USER: ${CREATORS_DB_USER:?runtime database login required}
    secrets:
      - {source: creators_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: creators_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: creators_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: creators_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: creators_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: creators_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
    healthcheck: *health
    deploy: *deploy
  identity:
    <<: *api
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: identity
      KOLOVIBE_ALLOWED_HOSTS: identity
      KOLOVIBE_DB_USER: ${IDENTITY_DB_USER:?runtime database login required}
      KOLOVIBE_SMTP_USER_FILE: /run/secrets/smtp_user
      KOLOVIBE_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      KOLOVIBE_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      KOLOVIBE_OUTBOUND_KEY_FILE: /run/secrets/audit_signing_key
      KOLOVIBE_TRUSTED_PEERS_FILE: /run/secrets/audit_peers
      KOLOVIBE_ACCOUNT_APPROVAL_FILE: /run/secrets/account_approvals
    secrets:
      - {source: identity_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_smtp_user, target: smtp_user, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_smtp_password, target: smtp_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_mfa_encryption, target: mfa_encryption_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_audit_signing, target: audit_signing_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_audit_peers, target: audit_peers, uid: "10001", gid: "10001", mode: 0400}
      - {source: identity_approvals, target: account_approvals, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
  engagement:
    <<: *api
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: engagement
      KOLOVIBE_ALLOWED_HOSTS: engagement
      KOLOVIBE_DB_USER: ${ENGAGEMENT_DB_USER:?runtime database login required}
    secrets:
      - {source: engagement_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: engagement_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: engagement_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: engagement_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: engagement_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: engagement_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
  points:
    <<: *api
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: points
      KOLOVIBE_ALLOWED_HOSTS: points
      KOLOVIBE_DB_USER: ${POINTS_DB_USER:?runtime database login required}
    secrets:
      - {source: points_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: points_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: points_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: points_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: points_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: points_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
  moderation:
    <<: *api
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: moderation
      KOLOVIBE_ALLOWED_HOSTS: moderation
      KOLOVIBE_DB_USER: ${MODERATION_DB_USER:?runtime database login required}
    secrets:
      - {source: moderation_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: moderation_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: moderation_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: moderation_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: moderation_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: moderation_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
  audit:
    <<: *api
    environment:
      <<: *environment
      KOLOVIBE_SERVICE_NAME: audit
      KOLOVIBE_ALLOWED_HOSTS: audit
      KOLOVIBE_DB_USER: ${AUDIT_DB_USER:?runtime database login required}
    secrets:
      - {source: audit_django, target: django_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: audit_db, target: db_password, uid: "10001", gid: "10001", mode: 0400}
      - {source: audit_tls_cert, target: tls_cert, uid: "10001", gid: "10001", mode: 0400}
      - {source: audit_tls_key, target: tls_key, uid: "10001", gid: "10001", mode: 0400}
      - {source: audit_callers, target: caller_keys, uid: "10001", gid: "10001", mode: 0400}
      - {source: audit_probe, target: probe_token, uid: "10001", gid: "10001", mode: 0400}
      - {source: internal_ca, target: internal_ca, uid: "10001", gid: "10001", mode: 0400}
      - {source: db_ca, target: db_ca, uid: "10001", gid: "10001", mode: 0400}
  rabbitmq:
    image: ${RABBITMQ_DHI_IMAGE:?reviewed dhi.io/rabbitmq@sha256 digest required}
    hostname: kolovibe-rabbitmq-1
    networks: [broker_private]
    configs:
      - {source: rabbitmq_conf, target: /etc/rabbitmq/rabbitmq.conf}
    secrets:
      - kolovibe_rmq_ca
      - kolovibe_rmq_cert
      - kolovibe_rmq_key
      - kolovibe_rmq_definitions
