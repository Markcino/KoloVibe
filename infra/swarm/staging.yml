    external: true
    name: ${STAGING_PRIVATE_NETWORK:?approved encrypted private overlay required}
  data_private:
    external: true
    name: kolovibe_data
  broker_private:
    external: true
    name: kolovibe_messaging

configs:
  rabbitmq_conf:
    file: ../rabbitmq/rabbitmq.conf

volumes:
