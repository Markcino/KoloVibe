# VM1 infrastructure bridge. Django web and Gateway both run on VM2.
# TCP passthrough preserves TLS verification at host Nginx.
global
    log stdout format raw local0
    maxconn 128

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend gateway_local
    bind /relay/gateway.sock mode 660
    default_backend gateway_private

backend gateway_private
    server gateway gateway:8000 check inter 5s fall 3 rise 2

frontend web_local
    bind /relay/web.sock mode 660
    default_backend web_private

backend web_private
    server web web:8001 check inter 5s fall 3 rise 2
