# VM1 host Nginx: the complete live vhost file (/etc/nginx/sites-enabled/kolovibe-staging.conf),
# captured read-only on 27 November 2026 (sha256 recorded in the Phase 2 report), plus the D12-001 edge
# controls. CANDIDATE: not applied. Applying it is an owner-approved change (see the Phase 2 report, plan E).
# Every vhost listens on loopback only, so its one peer is the local Cloudflare Tunnel connector and
# CF-Connecting-IP (set by Cloudflare) is believed from 127.0.0.1 only.
limit_req_zone $binary_remote_addr zone=kolovibe_edge_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=kolovibe_edge_conn:10m;

upstream kolovibe_private_gateway {
    server unix:/srv/kolovibe-edge/run/gateway.sock;
}

# Default and web application placeholder.
# Replace only the web placeholder in VM1's live vhost after the VM2 web service
# and separate HAProxy web.sock bridge are healthy.
upstream kolovibe_private_web {
    server unix:/srv/kolovibe-edge/run/web.sock;
}

server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:80;
    server_name kolovibe.cabetechs.shop;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    limit_req zone=kolovibe_edge_rate burst=40 nodelay;
    limit_conn kolovibe_edge_conn 20;
    limit_req_status 429;
    limit_conn_status 429;
    server_tokens off;
    client_max_body_size 16k;

    proxy_ssl_trusted_certificate /etc/nginx/kolovibe-web-upstream.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 1;
    proxy_ssl_name web;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    add_header Cache-Control "no-store" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host kolovibe.cabetechs.shop;
        proxy_set_header X-Forwarded-Host kolovibe.cabetechs.shop;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";
        proxy_set_header X-KoloVibe-Caller "";
        proxy_set_header X-KoloVibe-Signature "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass https://kolovibe_private_web;
    }
}


# Backend API: external access governed by Cloudflare Access.
server {
    listen 127.0.0.1:80;
    server_name api.cabetechs.shop;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    limit_req zone=kolovibe_edge_rate burst=20 nodelay;
    limit_conn kolovibe_edge_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    server_tokens off;

    location / {
        proxy_pass https://kolovibe_private_gateway;
        proxy_http_version 1.1;

        # Verify the Gateway certificate using the private CA.
        proxy_ssl_trusted_certificate /etc/nginx/kolovibe-internal-ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name gateway;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_set_header Host api.cabetechs.shop;
        proxy_set_header X-Forwarded-Host api.cabetechs.shop;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Real-IP "";

        # Never forward Cloudflare service credentials to Django.
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        add_header Cache-Control "no-store" always;
        add_header X-KoloVibe-Proxy "active" always;
    }
}

# KoloVibe mobile UAT — Cloudflare edge must restrict testers.
server {
    listen 127.0.0.1:80;
    server_name mobile-api.cabetechs.shop;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    limit_req zone=kolovibe_edge_rate burst=20 nodelay;
    limit_conn kolovibe_edge_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    server_tokens off;

    proxy_http_version 1.1;
    proxy_pass_request_headers on;

    proxy_ssl_trusted_certificate /etc/nginx/kolovibe-internal-ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name gateway;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    proxy_set_header Host mobile-api.cabetechs.shop;
    proxy_set_header X-Forwarded-Host mobile-api.cabetechs.shop;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header True-Client-IP "";
    proxy_set_header X-Real-IP "";

    # Remove credentials used for private service authentication.
    proxy_set_header CF-Access-Client-Id "";
    proxy_set_header CF-Access-Client-Secret "";
    proxy_set_header X-KoloVibe-Caller "";
    proxy_set_header X-KoloVibe-Timestamp "";
    proxy_set_header X-KoloVibe-Nonce "";
    proxy_set_header X-KoloVibe-Signature "";

    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    add_header Cache-Control "no-store" always;
    add_header X-KoloVibe-Mobile-Proxy "active" always;

    # Public liveness only.
    location = /health/live {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    # Public read-only metadata.
    location = /api/v1/videos {
        limit_except GET POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location ~ ^/api/v1/creators/[0-9A-Fa-f-]+$ {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/videos/[0-9A-Fa-f-]+$ {
        limit_except GET PATCH DELETE { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    # Ordinary-account API routes.
    location ~ ^/api/v1/auth/(register|verify|login|refresh|logout)$ {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/me {
        limit_except GET PATCH { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/creators/me/copyright {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/copyright/reports {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location ~ ^/api/v1/videos/[0-9A-Fa-f-]+/counter-notices$ {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/legal/terms {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/legal/privacy {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/legal/marketing {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/me/legal {
        limit_except GET POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/me/marketing-consent {
        limit_except PUT { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/me/step-up {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location = /api/v1/creators/me/restrictions {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location ~ ^/api/v1/creators/me/restrictions/[0-9A-Fa-f-]+/appeals$ {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
# Creator-owned video library
location = /api/v1/creators/me/videos {
    limit_except GET { deny all; }
    proxy_pass https://kolovibe_private_gateway;
}

# Creator-owned video details
location ~ ^/api/v1/creators/me/videos/[0-9A-Fa-f-]+$ {
    limit_except GET { deny all; }
    proxy_pass https://kolovibe_private_gateway;
}

# Request signed R2 upload intent
location ~ ^/api/v1/videos/[0-9A-Fa-f-]+/upload-intents$ {
    limit_except POST { deny all; }
    proxy_pass https://kolovibe_private_gateway;
}

# Complete upload or retrieve processing status
location ~ ^/api/v1/videos/[0-9A-Fa-f-]+/upload-status$ {
    limit_except GET POST { deny all; }
    proxy_pass https://kolovibe_private_gateway;
}

# Publish or unpublish a video
location ~ ^/api/v1/videos/[0-9A-Fa-f-]+/(publish|unpublish)$ {
    limit_except POST { deny all; }
    proxy_pass https://kolovibe_private_gateway;
}

# Retrieve authenticated playback information
location ~ ^/api/v1/videos/[0-9A-Fa-f-]+/playback$ {
    limit_except GET { deny all; }
    proxy_pass https://kolovibe_private_gateway;
}


    # Approved R1 mobile routes.
    location ~ ^/api/v1/(app/compatibility|videos/following|creators/search|me/(sessions|standing|reports|appeals)|creator-applications|creators/me/(upload-eligibility|analytics|points(/entries)?)|moderation/(videos|reports|appeals))$ {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/(me/(reports|appeals)/[0-9A-Fa-f-]+|creators/me/(points/entries/[0-9A-Fa-f-]+|videos/[0-9A-Fa-f-]+/(analytics|notice)))$ {
        limit_except GET { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/(auth/(verification/resend|password/(reset-request|reset)|mfa/verify)|me/reauthenticate|creator-invitations|reports|engagement/watch-events)$ {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/(creator-applications/[0-9A-Fa-f-]+/decision|videos/[0-9A-Fa-f-]+/(watch-sessions|shares|appeals)|moderation/(videos|reports|appeals)/[0-9A-Fa-f-]+/decisions)$ {
        limit_except POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/(creators/me/application|me/privacy-requests)$ {
        limit_except GET POST { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/(creators/me|me/preferences)$ {
        limit_except GET PATCH { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/(videos/[0-9A-Fa-f-]+/like|creators/[0-9A-Fa-f-]+/follow)$ {
        limit_except GET PUT DELETE { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location ~ ^/api/v1/me/sessions/[0-9A-Fa-f-]+$ {
        limit_except DELETE { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }
    location = /api/v1/me/password {
        limit_except PATCH { deny all; }
        proxy_pass https://kolovibe_private_gateway;
    }

    location /internal/ { return 403; }
    location /ops/ { return 403; }
    location / { return 404; }
}
