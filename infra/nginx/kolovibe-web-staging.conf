# Replace only the web placeholder in VM1's live vhost after the VM2 web service
# and separate HAProxy web.sock bridge are healthy.
# Rate limits key on the client address. This vhost listens on loopback only, so its peer is the
# local Cloudflare Tunnel connector and CF-Connecting-IP (set by Cloudflare) is believed from it.
limit_req_zone $binary_remote_addr zone=kolovibe_web_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=kolovibe_web_conn:10m;

upstream kolovibe_private_web {
    server unix:/srv/kolovibe-edge/run/web.sock;
}

server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:80;
    server_name kolovibe.cabetechs.shop;
    server_tokens off;
    client_max_body_size 16k;
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    limit_req zone=kolovibe_web_rate burst=40 nodelay;
    limit_conn kolovibe_web_conn 20;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_ssl_trusted_certificate /etc/nginx/kolovibe-web-upstream.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 1;
    proxy_ssl_name web;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;

    add_header Cache-Control "no-store" always;
    # The web application owns Content-Security-Policy so exactly one policy is sent.

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host kolovibe.cabetechs.shop;
        proxy_set_header X-Forwarded-Host kolovibe.cabetechs.shop;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";
        proxy_set_header X-KoloVibe-Caller "";
        proxy_set_header X-KoloVibe-Signature "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass https://kolovibe_private_web;
    }
}
