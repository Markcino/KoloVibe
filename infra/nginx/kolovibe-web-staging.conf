# Replace only the web placeholder in VM1's live vhost after the web container is healthy.
server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 127.0.0.1:80;
    server_name kolovibe.cabetechs.shop;
    server_tokens off;
    client_max_body_size 16k;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location /static/ {
        alias /srv/kolovibe-web/static/;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host kolovibe.cabetechs.shop;
        proxy_set_header X-Forwarded-Host kolovibe.cabetechs.shop;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";
        proxy_set_header X-KoloVibe-Caller "";
        proxy_set_header X-KoloVibe-Signature "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8001;
    }
}
