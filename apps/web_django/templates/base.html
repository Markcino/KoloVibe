{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KoloVibe administration{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}?v=material-admin-r1">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% block shell %}
  <header class="site-header"><a class="brand" href="{% url 'root' %}"><img src="{% static 'images/landscape_logo_with_name.svg' %}" alt="KoloVibe"></a><span>Administration</span></header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  {% endblock %}
</body>
</html>
