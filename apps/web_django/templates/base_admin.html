{% extends 'base.html' %}
{% load static %}
{% block shell %}
<div class="admin-shell">
  <aside class="sidebar">
    <a class="brand" href="{% url 'dashboard' %}"><img src="{% static 'images/landscape_logo_with_name.svg' %}" alt="KoloVibe administration"></a>
    <nav aria-label="Administration">
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'moderation-videos' %}">Videos</a>
      <a href="{% url 'moderation-reports' %}">Reports</a>
      <a href="{% url 'moderation-appeals' %}">Appeals</a>
      <a href="{% url 'points' %}">Points</a>
      <a href="{% url 'audit' %}">Audit</a>
      <a href="{% url 'account' %}">Account</a>
    </nav>
    <p><span class="role-badge">{{ role|title }}</span></p>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Sign out</button></form>
  </aside>
  <main id="main" tabindex="-1">
    <p class="session-notice" role="note">Your session expires 15 minutes after sign-in. When it expires, sign in again to continue.</p>
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
