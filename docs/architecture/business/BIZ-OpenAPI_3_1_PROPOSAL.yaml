components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Django-signed
  parameters:
    BusinessId:
      name: business_id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema: *id001
    ReviewId:
      name: review_id
      in: path
      required: true
      schema: *id001
    ReportId:
      name: report_id
      in: path
      required: true
      schema: *id001
    CaseId:
      name: case_id
      in: path
      required: true
      schema: *id001
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema: *id001
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: *id001
    MemberId:
      name: member_id
      in: path
      required: true
      schema: *id001
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: *id001
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
      description: Opaque, tamper-evident cursor.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,128}$
  responses:
    BadRequest:
      description: 'Invalid request: unknown field, wrong type, out of bounds or malformed cursor'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or revoked session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, MFA or verified-email requirement not met, or a policy refusal that may be disclosed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Object does not exist OR the caller is not entitled to it (indistinguishable by design)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: State conflict, duplicate, idempotency-key reuse with a different payload, or policy refusal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Throttled
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Service unavailable; no detail
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        detail:
          type: string
      required:
      - detail
    Category:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        slug:
          type: string
          pattern: ^[a-z0-9-]{2,60}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        parent_slug:
          type:
          - string
          - 'null'
        active:
          type: boolean
      required:
      - id
      - slug
      - name
    CategoryList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Category'
      required:
      - items
    CategoryInput:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]{2,60}$
        name:
          type: string
          minLength: 1
          maxLength: 80
        parent_slug:
          type:
          - string
          - 'null'
        active:
          type: boolean
    Rating:
      type: object
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
        average:
          type:
          - number
          - 'null'
          minimum: 1
          maximum: 5
          description: Null below the owner-approved minimum review count.
      required:
      - count
      - average
    PublicContact:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - phone
          - email
          - website
          - social
        value:
          type: string
          minLength: 1
          maxLength: 254
      required:
      - kind
      - value
    BusinessSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/Category'
        county_code:
          type: string
          minLength: 1
          maxLength: 40
        city:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
          maxLength: 200
        verified:
          type: boolean
        rating:
          $ref: '#/components/schemas/Rating'
        open_now:
          type:
          - boolean
          - 'null'
      required:
      - id
      - display_name
      - category
      - county_code
      - verified
      - rating
    HoursRule:
      type: object
      additionalProperties: false
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        opens:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        closes:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$
      required:
      - weekday
      - opens
      - closes
    HoursException:
      type: object
      additionalProperties: false
      properties:
        on_date:
          type: string
          format: date
        closed:
          type: boolean
        opens:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        closes:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$|^24:00$
      required:
      - on_date
      - closed
    Hours:
      type: object
      additionalProperties: false
      properties:
        time_zone:
          type: string
          default: Africa/Monrovia
          maxLength: 64
        rules:
          type: array
          maxItems: 28
          items:
            $ref: '#/components/schemas/HoursRule'
        exceptions:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/HoursException'
      required:
      - time_zone
      - rules
    HoursReplace:
      type: object
      additionalProperties: false
      properties:
        time_zone:
          type: string
          maxLength: 64
        rules:
          type: array
          maxItems: 28
          items:
            $ref: '#/components/schemas/HoursRule'
        exceptions:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/HoursException'
      required:
      - rules
    BusinessDetail:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          $ref: '#/components/schemas/Category'
        description:
          type: string
          maxLength: 2000
        county_code:
          type: string
          minLength: 1
          maxLength: 40
        city:
          type: string
          minLength: 1
          maxLength: 80
        address_line:
          type:
          - string
          - 'null'
