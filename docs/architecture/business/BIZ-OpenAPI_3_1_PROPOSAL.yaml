        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: category
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9-]{2,60}$
      - name: county
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9_]{2,40}$
        description: Controlled region value; list pending DR-BZ-10.
      - name: open_now
        in: query
        schema:
          type: boolean
      - name: verified
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - name
          default: relevance
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
