# Business module (R2) — OpenAPI 3.1 PROPOSAL
#
# STATUS: PROPOSED. Not approved, not implemented, not deployed. Every operation is x-implementation: none.
# Phase 6A, 24 November 2026. Companion documents: docs/requirements/DOC-020_Business_Requirements_and_Scope_PROPOSED.md,
# docs/security/phase6/BIZ-RBAC_and_Object_Authorization_Matrix_PROPOSED.md (BZ-AZ-nn rows),
# docs/architecture/business/BIZ-Owner_Decision_Register_PROPOSED.md (DR-BZ-nn open policies).
#
# UPDATE 24 November 2026: Phase 6B implemented most of these operations, with changes, and merged them into DOC-205
# (the authoritative contract). Where this proposal and DOC-205 differ, DOC-205 wins. See
# docs/engineering/phase6/Phase6B_Business_Backend_Completion_Report_2026-11-24.md.
#
# CLIENT SURFACES (DR-BZ-21, decided 24 November 2026): every operation below that is not under /moderation or /admin is
# called by the Flutter mobile app (visitors, customers, owners and staff); every /moderation and /admin Business operation
# is called only by the protected Django console (moderators and administrators, MFA). There is no public website and no
# business web portal. The anonymous reads (security: []) serve the mobile app only and authorize no web page. See
# docs/architecture/business/BIZ-Client_Architecture_DR-BZ-21.md and the authoritative per-operation list in
# docs/security/phase6/BIZ-API_Security_Matrix_PHASE6A.md.
#
# This file is deliberately NOT part of DOC-205 and is not read by any repository test. If the owner approves the
# design, S1 merges the approved operations into DOC-205 so the existing route-contract test (every gateway route must be
# declared; anonymous list exactly as declared) covers them.
#
# Vendor extensions:
#   x-implementation   none (every operation here)
#   x-slice            backlog slice that would introduce the route (S2..S8)
#   x-capability       gateway flag that keeps the route closed by default
#   x-required-roles   Identity roles allowed through the gateway (DOC-205 convention)
#   x-business-roles   per-business membership roles allowed (owner, staff); checked by the Business service per object
#   x-requires-mfa     true when the live session must be MFA-verified (existing principal() behaviour)
#   x-authz-ref        row in the authorization matrix
#   x-requirements     BZ-R requirement ids
#   x-policy-pending   open owner decisions that change this operation's behaviour
#
# Conventions: errors use the gateway shape {"detail": "..."}; a caller without entitlement to an object gets 404, never 403,
# so existence is not disclosed; all request bodies reject unknown fields; text is plain text; cursors are opaque.
openapi: 3.1.0
