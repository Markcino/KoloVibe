  /videos/{video_id}/shares:
    post:
      tags:
      - Engagement
      operationId: recordVideoShare
      summary: Record one authenticated share intent per UTC day
      x-implementation: local
      x-capability: engagement
      x-required-roles:
      - viewer
      - creator
      description: Requires a currently published public non-deleted video from Content. Request body and query
        parameters are not accepted. The gateway records at most one share per account/video/UTC day and returns
        an app link, KOLOVIBE_APP_LINK_ORIGIN + /open/videos/<id> (owner decision SIM-02, no public website). The
        origin must be an HTTPS origin without credentials, path, query or fragment, and is validated at settings
        load with the iOS app ID and Android package and signing fingerprints. The same origin serves /.well-known/apple-app-site-association
        and /.well-known/assetlinks.json claiming only /open/videos/*, and GET /open/videos/<id> only redirects
        a phone browser without the app to its store; it does not look the video up. Without an origin and at least
        one app association, the request returns 503 share_unavailable and records no share. A share is an intent,
        not evidence of delivery to another service; it emits no points or qualification event.
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
