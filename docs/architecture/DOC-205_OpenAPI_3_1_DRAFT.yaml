      tags:
      - Operations
      summary: Dependency readiness
      operationId: get__health_ready
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: Success; no response body
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      description: Not exposed publicly through Nginx; only cluster health checks.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Django-signed
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Workload token, audience- and scope-bound; mTLS required for internal APIs.
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
      required:
      - type
      - title
      - status
      - code
      - request_id
    RegistrationResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        verification_required:
          const: true
      required: [id, verification_required]
    VerificationRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 32
          maxLength: 128
      required: [code]
    VerificationResponse:
      type: object
      additionalProperties: false
      properties:
        verified:
          const: true
      required: [verified]
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 32
          maxLength: 128
      required: [refresh_token]
    AppCompatibility:
      type: object
      additionalProperties: false
      required: [status, minimum_version, latest_version, store_url]
      properties:
        status: {type: string, enum: [unknown, supported, update_available, update_required]}
        minimum_version: {type: [string, 'null'], maxLength: 128}
        latest_version: {type: [string, 'null'], maxLength: 128}
        store_url: {type: [string, 'null'], format: uri, pattern: '^[Hh][Tt][Tt][Pp][Ss]://', maxLength: 2048}
      example:
        status: unknown
        minimum_version: null
        latest_version: null
        store_url: null
    ReauthenticationResponse:
      type: object
      additionalProperties: false
      required: [reauth_token, expires_at]
      properties:
        reauth_token: {type: string, minLength: 32, maxLength: 128}
        expires_at: {type: string, format: date-time}
    PrivacyRequestReceipt:
      type: object
      additionalProperties: false
      required: [id, kind, status, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [access, deletion]}
        status: {type: string, enum: [received, in_review, completed, declined]}
        created_at: {type: string, format: date-time}
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        created_at: &id002
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - roles
      - created_at
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 80
      required:
      - email
      - password
      - display_name
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required: [mfa_required, challenge_token, expires_in]
      properties:
        mfa_required:
          const: true
        challenge_token:
          type: string
          minLength: 32
          maxLength: 128
        expires_in:
          const: 300
    MfaVerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
          minLength: 32
          maxLength: 128
        code:
          type: string
          description: Six-digit TOTP or one-use recovery code; never logged
          pattern: '^(?:[0-9]{6}|[a-zA-Z0-9_-]{32,128})$'
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          enum:
          - Bearer
        refresh_token:
          type: string
      required:
      - access_token
      - expires_in
      - token_type
      - refresh_token
      - user
    PilotCreatorApplication:
      type: object
      additionalProperties: false
      required: [account_id, status, creator_id]
      properties:
        account_id: {type: string, format: uuid}
        status: {type: string, enum: [invited, pending, approved, rejected]}
        creator_id: {type: [string, 'null'], format: uuid}
    Creator:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        user_id: *id001
        handle:
          type: string
          pattern: '^[a-zA-Z0-9_-]{1,40}$'
        bio:
          type: string
          maxLength: 500
        status:
          type: string
          enum:
          - active
          - restricted
          - suspended
      required:
      - id
      - user_id
      - handle
      - bio
      - status
    CreatorUpdate:
      type: object
      additionalProperties: false
      properties:
        bio:
          type: string
          maxLength: 500
        display_name:
          type: string
          maxLength: 80
      required: []
    Video:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        creator_id: *id001
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        state:
          type: string
          enum:
          - draft
          - uploading
          - processing
          - failed
          - review
          - published
          - rejected
          - removed
        duration_seconds:
          type: integer
          minimum: 0
        created_at: *id002
      required:
      - id
      - creator_id
      - title
      - description
      - state
      - created_at
    OwnVideoDetail:
      type: object
      additionalProperties: false
      required: [id, creator_id, title, description, state, created_at, revision]
      properties:
        id: {type: string, format: uuid}
        creator_id: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 2000}
        state: {type: string, enum: [draft, uploading, processing, failed, review, published, rejected, removed]}
        created_at: {type: string, format: date-time}
        revision: {type: integer, minimum: 0}
    CreatorContentAnalytics:
      type: object
      additionalProperties: false
      required: [total_videos, videos_by_state]
      properties:
        total_videos: {type: integer, minimum: 0}
        videos_by_state:
          type: object
          additionalProperties: false
          required: [draft, uploading, processing, failed, review, published, rejected, removed]
          properties:
            draft: {type: integer, minimum: 0}
            uploading: {type: integer, minimum: 0}
            processing: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            review: {type: integer, minimum: 0}
            published: {type: integer, minimum: 0}
            rejected: {type: integer, minimum: 0}
            removed: {type: integer, minimum: 0}
    VideoEngagementAnalytics:
      type: object
      additionalProperties: false
      required: [video_id, state, current_likes, qualified_viewers]
      properties:
        video_id: {type: string, format: uuid}
        state: {type: string, enum: [draft, uploading, processing, failed, review, published, rejected, removed]}
        current_likes: {type: integer, minimum: 0}
        qualified_viewers: {type: integer, minimum: 0}
    VideoCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
      required:
      - title
    UploadIntent:
      type: object
      additionalProperties: false
      required: [upload_id, video_id, upload_url, upload_headers, expires_at, max_bytes]
      properties:
        upload_id: *id001
        video_id: *id001
        upload_url: {type: string, format: uri}
        upload_headers:
          type: object
          additionalProperties: false
          required: [Content-Type, Content-Length, If-None-Match]
          properties:
            Content-Type: {const: video/mp4}
            Content-Length: {type: string, pattern: '^[1-9][0-9]*$'}
            If-None-Match: {const: '*'}
        expires_at: *id002
        max_bytes: {type: integer, const: 52428800}
    VideoUploadStatus:
      type: object
      additionalProperties: false
      required: [video_id, state]
      properties:
        video_id: {type: string, format: uuid}
        state: {type: string, enum: [draft, uploading, processing, failed, review, published, rejected, removed]}
    Playback:
      type: object
      additionalProperties: false
      properties:
        playback_url:
          type: string
          format: uri
        expires_at: *id002
      required:
      - playback_url
      - expires_at
    WatchEvent:
      type: object
      additionalProperties: false
      required: [video_id, session_id, position_ms]
      properties:
        video_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        position_ms: {type: integer, minimum: 0, maximum: 300000}
    Like:
      type: object
      additionalProperties: false
      properties:
        video_id: *id001
        liked:
          type: boolean
        updated_at: *id002
      required:
      - video_id
      - liked
    PointsBalance:
      type: object
      additionalProperties: false
      properties:
        creator_id: *id001
        balance:
          type: integer
        currency:
          type: string
          enum:
          - POINTS
        as_of: *id002
      required:
      - creator_id
      - balance
      - currency
      - as_of
    PointsEntry:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        creator_id: *id001
        amount:
          type: integer
        kind:
          type: string
          enum:
          - award
          - reversal
          - adjustment
        rule_version:
          type: string
        created_at: *id002
      required:
      - id
      - creator_id
      - amount
      - kind
      - rule_version
      - created_at
    ReportCreate:
      type: object
      additionalProperties: false
      properties:
        video_id: *id001
