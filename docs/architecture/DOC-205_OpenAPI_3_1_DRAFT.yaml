openapi: 3.1.0
info:
  title: KoloVibe full-application API
  version: 1.1.0-review
  description: 'Canonical API design and implementation inventory. Existing operations retain their implementation
    status. x-implementation: planned operations are design-only, not available on Gateway or staging. Phase 2 contract
    approval and technical/security sign-off remain pending (#305, #140, #141). Paths are relative to /api/v1 except
    explicit internal/health overrides. Django without DRF. No live payments, live ads or production activation.'
x-default-implementation: gated
servers:
- url: https://api.example.invalid/api/v1
  description: Placeholder; never use in production
tags:
- name: Identity
- name: Creators
- name: Content
- name: Engagement
- name: Points
- name: Moderation
- name: Operations
- name: Internal Events
- name: Business
- name: Finance
- name: Events
- name: Advertising
- name: Notifications
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Identity
      summary: Register user
      operationId: post__auth_register
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          description: The accepted version of the terms or privacy notice is not the current one; code legal_version_outdated.
            Nothing is created or sent.
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Invalid request; application/problem+json
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
      description: Creates an inactive local account and sends a single-use verification code. Requires configured
        mail delivery. Under Decision B, `accepted` must name the current versions of the terms and the privacy
        notice (from GET /legal/terms and /legal/privacy); Identity records each version and its text digest. `marketing_consent`
        is optional, false by default, and recorded separately; accepting the terms or the privacy notice is never
        marketing, advertising or tracking consent. The acceptance is checked before the attempt budget, the account
        or any email. Every attempt, for a new or an existing address, counts against a budget of 20 per hour per
        trusted network origin (the same budget as code emails); a spent budget answers 429 and creates nothing.
        With no trusted origin configured at the edge only the other limits apply. An already registered address
        gets the same 201 and body shape as a new one, with a random identifier that names no account (ADR-013 amendment
        A-2, defect D11-003); nothing is recorded for the existing account. Only the address owner is told. A still-unverified
        account receives a fresh verification code under the normal send limits, and a verified account receives
        a notice pointing to sign-in and password reset, at most 3 per hour per address. No 409 is returned.
      x-service-owner: identity
  /auth/verification/resend:
    post:
      tags:
      - Identity
      operationId: resendEmailVerification
      summary: Request another email verification code
      description: The response is identical for unknown, verified, or throttled addresses. An eligible request
        replaces every earlier code, after a 60-second cooldown and at most 3 emails per hour. Each email carries
        a new six-digit code that expires in 30 minutes.
      x-implementation: local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '204':
          description: Request accepted without disclosing delivery or account state
        '400':
          description: Invalid email or request body
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /auth/verify:
    post:
      tags:
      - Identity
      operationId: post__auth_verify
      x-implementation: local
      summary: Verify local account email with the six-digit code that was emailed
      description: 'Send the address the code was mailed to together with the six digits. The code proves access
        to that mailbox and nothing more: it is **not** multifactor authentication and no session is issued.

        A code lives 30 minutes, works once, and is destroyed by its fifth wrong guess. An address that fails 10
        times in an hour, or a trusted network origin that fails 40 times in 15 minutes, receives 429 until the
        window passes, even for a correct code. Unknown addresses, wrong, expired, used and exhausted codes all
        return the same 400. A bare long `code` (no `email`) is the retired link, honoured only for links already
        mailed before this contract and removed 24 hours after rollout.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Invalid, expired, reused or unknown code or address (identical answers)
        '429':
          description: Too many attempts; try again later. Returned for known and unknown addresses alike.
        '503':
          description: Identity unavailable
      x-service-owner: identity
  /auth/password/reset-request:
    post:
      tags:
      - Identity
      operationId: requestPasswordReset
      x-implementation: local
      summary: Request a single-use password reset code
      description: Unknown, eligible and throttled accounts receive the same empty response, including delivery
        failure. An eligible account is mailed a six-digit code that expires in 15 minutes, after a 60-second cooldown
        and at most 3 emails per hour; a new code replaces earlier ones. Privileged account recovery requires a
        separate reviewed workflow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '204':
          description: Request accepted
        '400':
          description: Invalid request
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /auth/password/reset:
    post:
      tags:
      - Identity
      operationId: resetPassword
      x-implementation: local
      summary: Consume the six-digit reset code and revoke all account sessions
      description: Same limits as email verification. 5 wrong guesses destroy the code, 10 per address per hour
        and 40 per trusted origin per 15 minutes return 429. A weak new password is rejected without spending the
        code. No session is issued; the person signs in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - code
              - new_password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Required with a six-digit code, omitted only by the retired long link
                code:
                  oneOf:
                  - type: string
                    pattern: ^[0-9]{6}$
                  - type: string
                    minLength: 32
                    maxLength: 128
                    deprecated: true
                    description: Retired long link, accepted without email until it expires
                new_password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '204':
          description: Password changed and sessions revoked
        '400':
          description: Invalid or expired code or password
        '429':
          description: Too many attempts
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /auth/login:
    post:
      tags:
      - Identity
      summary: Authenticate user
      operationId: post__auth_login
      x-implementation: local
      responses:
        '202':
          description: Password accepted; privileged session requires MFA (approved staging capability only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      x-service-owner: identity
  /auth/mfa/verify:
    post:
      tags:
      - Identity
      summary: Complete a password-bound privileged MFA challenge
      description: TOTP accepts only the current server-aligned 30-second period, once. Previous and future periods
        are rejected without clock-skew tolerance. A code received at the next period boundary is expired. Devices
        and servers require synchronized clocks. One-use recovery codes remain supported.
      operationId: post__auth_mfa_verify
      x-implementation: staging-gated
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerificationRequest'
      responses:
        '200':
          description: MFA verified; privileged refresh cannot extend the 900-second reauthentication deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed gateway request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /auth/refresh:
    post:
      tags:
      - Identity
      summary: Rotate refresh token
      operationId: post__auth_refresh
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      description: Local gateway accepts a JSON refresh token. The web server reads it from an HttpOnly browser
        cookie; mobile uses OS secure storage. Single-use rotation and reuse-family revocation apply. Production
        remains gated.
      x-service-owner: identity
  /auth/logout:
    post:
      tags:
      - Identity
      summary: Revoke current session
      operationId: post__auth_logout
      x-implementation: local
      security: []
      description: Revokes by bearer access token or JSON refresh token. No response body. Both access and refresh
        credentials are rejected on the next protected request; the gateway checks live identity session state without
        caching.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: Success; no response body
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      x-service-owner: identity
  /me/preferences:
    get:
      tags:
      - Identity
      operationId: getMyPreferences
      x-implementation: local
      summary: Read the signed-in account notification preferences
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Own notification preferences
          content:
            application/json:
              schema:
                type: object
                required:
                - email_notifications
                - push_notifications
                properties:
                  email_notifications:
                    type: boolean
                  push_notifications:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
    patch:
      tags:
      - Identity
      operationId: updateMyPreferences
      x-implementation: local
      summary: Replace own notification preferences; delivery requires separate activation
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email_notifications
              - push_notifications
              properties:
                email_notifications:
                  type: boolean
                push_notifications:
                  type: boolean
      responses:
        '200':
          description: Updated own preferences
        '400':
          description: Invalid preference fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /me/privacy-requests:
    get:
      tags:
      - Identity
      operationId: listMyPrivacyRequests
      x-implementation: local
      summary: List up to 40 most recent own privacy request receipts
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Own privacy request records, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    maxItems: 40
                    items:
                      $ref: '#/components/schemas/PrivacyRequestReceipt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
    post:
      tags:
      - Identity
      operationId: requestMyPrivacyAction
      x-implementation: local
      summary: Receive an access or deletion request without executing it
      description: 'Consume a five-minute, single-use reauth_token bound to this account and current login session.
        current_password remains accepted for compatibility, with the same account-wide reauthentication attempt
        budget. If both are supplied, the token takes precedence with no password fallback. A valid token is consumed
        even when an open request returns 409. A received, in_review or processing request blocks another request
        of the same kind. This operation never disables accounts or purges data: an administrator reviews each request
        (Decision C), and an approved deletion deactivates the account. Erasure in every service, and completed,
        come later.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - kind
              anyOf:
              - required:
                - reauth_token
              - required:
                - current_password
              properties:
                kind:
                  type: string
                  enum:
                  - access
                  - deletion
                reauth_token:
                  type: string
                  minLength: 32
                  maxLength: 128
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                  deprecated: true
      responses:
        '201':
          description: Request received without performing the requested action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyRequestReceipt'
        '400':
          description: Invalid request or generic reauthentication failure
        '409':
          description: Another open request of this kind exists for the account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - detail
                - code
                properties:
                  detail:
                    type: string
                  code:
                    const: request_open
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /me/privacy-requests/{request_id}/export:
    post:
      tags:
      - Identity
      operationId: retrieveMyAccessExport
      x-implementation: local
      x-capability: account_management
      summary: Retrieve the account's own completed access export (mandate 3.3)
      description: Only the account that made the access request can retrieve it, with a fresh reauth_token or current_password,
        and only from when every participating service delivered its part until it expires. The retrieval window
        is configuration (KOLOVIBE_EXPORT_RETRIEVAL_SECONDS), an owner decision with no default. Every retrieval
        and denial is audited. Expired data is removed on first access after expiry and by purge_expired_exports.
        Each service part names categories withheld pending a decision and categories cut at the row limit. Never
        cached.
      security:
      - bearerAuth: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              anyOf:
              - required:
                - reauth_token
              - required:
                - current_password
              properties:
                reauth_token:
                  type: string
                  minLength: 32
                  maxLength: 128
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: The assembled export
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessExport'
        '400':
          description: Invalid request or generic reauthentication failure
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No access export of this account with this id
        '409':
          description: 'Not ready yet: code export_not_ready'
        '410':
          description: 'Expired and removed: code export_expired'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /me/reauthenticate:
    post:
      tags:
      - Identity
      operationId: reauthenticateMyAccount
      x-implementation: local
      summary: Confirm the current password for one sensitive request
      description: Issues a random token stored only as a keyed digest, bound to the account and current login session.
        Expires after five minutes and is single-use. All attempts, including successful issuance, share an account-wide
        limit of five attempts per fifteen minutes with the legacy privacy password path and password changes. Success
        records account.reauthenticated in the identity audit outbox. No password or token is included in audit
        events.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Session-bound reauthentication proof; response must not be cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthenticationResponse'
        '400':
          description: Generic reauthentication failure; no credential detail disclosed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /legal/terms:
    get:
      tags:
      - Identity
      operationId: getTermsOfService
      x-implementation: local
      summary: Current terms of service (Decision B)
      description: Public, so the text can be read before registration. Versioned, dated and pinned to a SHA-256
        in Identity; a changed text is a new version. status is pending_legal_review until counsel approves the
        text.
      security: []
      responses:
        '200':
          description: The current version and its text; may be cached for five minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /legal/privacy:
    get:
      tags:
      - Identity
      operationId: getPrivacyNotice
      x-implementation: local
      summary: Current privacy notice (Decision B)
      description: Public, so the text can be read before registration. Versioned, dated and pinned to a SHA-256
        in Identity; a changed text is a new version. status is pending_legal_review until counsel approves the
        text.
      security: []
      responses:
        '200':
          description: The current version and its text; may be cached for five minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /legal/marketing:
    get:
      tags:
      - Identity
      operationId: getMarketingConsentText
      x-implementation: local
      summary: Current wording of the optional marketing consent (Decision B)
      description: Public, so the text can be read before registration. Versioned, dated and pinned to a SHA-256
        in Identity; a changed text is a new version. status is pending_legal_review until counsel approves the
        text.
      security: []
      responses:
        '200':
          description: The current version and its text; may be cached for five minutes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalDocument'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /me/legal:
    get:
      tags:
      - Identity
      operationId: getLegalAcceptance
      x-implementation: local
      summary: What this account has accepted, and whether a newer version needs acceptance (Decision B)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Acceptance state; must not be cached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
    post:
      tags:
      - Identity
      operationId: acceptLegalDocuments
      x-implementation: local
      summary: Accept the current version of one or both required documents (Decision B)
      description: Each named version must be current, or the answer is 409 legal_version_outdated and nothing is
        recorded. Accepting a version already accepted records nothing new. Records are append-only and keep the
        text digest.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - accepted
              properties:
                accepted:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    terms:
                      type: string
                      minLength: 1
                      maxLength: 32
                    privacy:
                      type: string
                      minLength: 1
                      maxLength: 32
      responses:
        '200':
          description: The new acceptance state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalState'
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A named version is not current; code legal_version_outdated
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /me/marketing-consent:
    put:
      tags:
      - Identity
      operationId: setMarketingConsent
      x-implementation: local
      summary: Grant or withdraw the optional marketing consent (Decision B)
      description: Separate from the terms and the privacy notice and off unless granted. version names the wording
        shown. Only a change is recorded; every grant and withdrawal is kept. No marketing is sent by this release.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - granted
              - version
              properties:
                granted:
                  type: boolean
                version:
                  type: string
                  minLength: 1
                  maxLength: 32
      responses:
        '200':
          description: The new state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalState'
        '400':
          description: Invalid request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The wording version is not current; code legal_version_outdated
        '503':
          $ref: '#/components/responses/LocalUnavailable'
      x-service-owner: identity
  /me/step-up:
    post:
      tags:
      - Identity
      operationId: obtainStepUpProof
      x-implementation: local
      summary: Obtain a purpose-bound step-up proof for one sensitive action (Decision G)
      description: 'Identity owns the only step-up mechanism. The current password is confirmed and a random proof
        is issued, stored only as a keyed digest and bound to the account, the login session, the named purpose,
        the one service that may accept it and, where the purpose requires it, the resource id. It expires after
        five minutes and is consumed once, by the Gateway, when it is sent as the X-Step-Up-Token header of the
        operation it was obtained for. Issuance shares the account-wide reauthentication limit. Purposes are a fixed
        list owned by Identity: business.member_remove, business.contact_change, business.close and business.ownership_transfer
        (resource: the business id). Issuance, consumption and refusal are audited without the proof.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - purpose
              properties:
                current_password:
                  type: string
                  minLength: 1
                  maxLength: 128
                purpose:
                  type: string
                  minLength: 3
                  maxLength: 64
                resource_id:
                  type: string
                  format: uuid
      responses:
        '200':
