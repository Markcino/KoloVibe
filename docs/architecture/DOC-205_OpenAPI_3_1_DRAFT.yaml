          - invalid_media
          - cover_out_of_range
          - processing_unavailable
          - poster_failed
          - upload_missing
          - upload_changed
        retryable:
          type: boolean
          description: Upload may be retried for draft/uploading/failed; transient processing failure permits completion
            to be retried.
    Playback:
      type: object
