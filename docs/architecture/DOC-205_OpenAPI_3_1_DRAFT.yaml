components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Django-signed
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Workload token, audience- and scope-bound; mTLS required for internal APIs.
    internalCaller:
      type: apiKey
      in: header
      name: X-KoloVibe-Caller
    internalTimestamp:
      type: apiKey
      in: header
      name: X-KoloVibe-Timestamp
    internalNonce:
      type: apiKey
      in: header
      name: X-KoloVibe-Nonce
    internalSignature:
      type: apiKey
      in: header
      name: X-KoloVibe-Signature
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: 'Design marker only: exact provider-specific signature/timestamp headers and raw-body verification
        require provider approval. Bearer token is insufficient.'
    serviceIdentity:
      type: apiKey
      in: header
      name: X-Service-Signature
      description: 'Existing per-peer HMAC protocol: audience, method/path, body digest, timestamp and nonce. See
        shared service_identity verifier; not a bearer substitute.'
  schemas:
    ModeratorInvitationCreate:
      type: object
      additionalProperties: false
      required:
      - email
      - display_name
      - reason
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        display_name:
          type: string
          maxLength: 80
          minLength: 2
        reason:
          type: string
          maxLength: 500
          minLength: 3
    ModeratorInvitationRevoke:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          maxLength: 500
          minLength: 3
    ModeratorInvitationReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - expires_at
      properties:
        id:
          type: string
          format: uuid
        status:
          const: pending
        expires_at:
          type: string
          format: date-time
    ModeratorInvitationPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - display_name
            - email_masked
            - status
            - expires_at
            properties:
              id:
                type: string
                format: uuid
              display_name:
                type: string
                maxLength: 80
                minLength: 2
              email_masked:
                type: string
                maxLength: 257
                minLength: 1
              status:
                enum:
                - pending
                - accepted
                - revoked
                - expired
              expires_at:
                type: string
                format: date-time
              account_id:
                type: string
                format: uuid
                description: Present only when status is accepted; the moderator account created by the invitation.
        next_cursor:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
    ModeratorInvitationSetup:
      type: object
      additionalProperties: false
      required:
      - email
      - invitation_code
      - password
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        invitation_code:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[A-Za-z0-9_-]{64}$
          writeOnly: true
        password:
          type: string
          maxLength: 128
          minLength: 12
          writeOnly: true
    ModeratorInvitationSetupResult:
      type: object
      additionalProperties: false
      required:
      - secret
      - expires_at
      properties:
        secret:
          type: string
          maxLength: 32
          minLength: 32
          pattern: ^[A-Z2-7]{32}$
          description: Private authenticator setup key for this invitee only; never cache or log.
        expires_at:
          type: string
          format: date-time
    ModeratorInvitationComplete:
      type: object
      additionalProperties: false
      required:
      - email
      - invitation_code
      - code
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        invitation_code:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[A-Za-z0-9_-]{64}$
          writeOnly: true
        code:
          type: string
          maxLength: 6
          minLength: 6
          pattern: ^[0-9]{6}$
          writeOnly: true
    ModeratorInvitationCompleteResult:
      type: object
      additionalProperties: false
      required:
      - enrolled
      - recovery_codes
      properties:
        enrolled:
          const: true
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            maxLength: 128
            minLength: 32
            pattern: ^[A-Za-z0-9_-]{32,128}$
          description: Shown once to the enrolled moderator; stored hashed and never logged.
    ModeratorInvitationAdministration:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - access_token
        - operation
        properties:
          access_token:
            type: string
            maxLength: 2048
            writeOnly: true
          operation:
            const: list
          cursor:
            type: string
            format: uuid
      - type: object
        additionalProperties: false
        required:
        - access_token
        - operation
        - email
        - display_name
        - reason
        - key
        properties:
          access_token:
            type: string
            maxLength: 2048
            writeOnly: true
          operation:
            const: create
          email:
            type: string
            maxLength: 254
            format: email
          display_name:
            type: string
            maxLength: 80
            minLength: 2
          reason:
            type: string
            maxLength: 500
            minLength: 3
          key:
            type: string
            maxLength: 128
            minLength: 16
            pattern: ^[A-Za-z0-9_-]{16,128}$
      - type: object
        additionalProperties: false
        required:
        - access_token
        - operation
        - id
        - reason
        - key
        properties:
          access_token:
            type: string
            maxLength: 2048
            writeOnly: true
          operation:
            const: revoke
          id:
            type: string
            format: uuid
          reason:
            type: string
            maxLength: 500
            minLength: 3
          key:
            type: string
            maxLength: 128
            minLength: 16
            pattern: ^[A-Za-z0-9_-]{16,128}$
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
      required:
      - type
      - title
      - status
      - code
      - request_id
    RegistrationResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        verification_required:
          const: true
      required:
      - id
      - verification_required
    VerificationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Address the code was mailed to. Required with a six-digit code.
        code:
          oneOf:
          - type: string
            pattern: ^[0-9]{6}$
            description: Six-digit code from the email. Never logged.
          - type: string
            minLength: 32
            maxLength: 128
            deprecated: true
            description: Retired long link, accepted without email until it expires.
      required:
      - code
    VerificationResponse:
      type: object
      additionalProperties: false
      properties:
        verified:
          const: true
      required:
      - verified
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 32
          maxLength: 128
      required:
      - refresh_token
    AppCompatibility:
      type: object
      additionalProperties: false
      required:
      - status
      - minimum_version
      - latest_version
      - store_url
      properties:
        status:
          type: string
          enum:
          - unknown
          - supported
          - update_available
          - update_required
        minimum_version:
          type:
          - string
          - 'null'
          maxLength: 128
        latest_version:
          type:
          - string
          - 'null'
          maxLength: 128
        store_url:
          type:
          - string
          - 'null'
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]://
          maxLength: 2048
      example:
        status: unknown
        minimum_version: null
        latest_version: null
        store_url: null
    LegalDocument:
      type: object
      additionalProperties: false
      required:
      - kind
      - title
      - version
      - effective_at
      - status
      - sha256
      - text
      properties:
        kind:
          type: string
          enum:
          - terms
          - privacy
          - marketing
        title:
          type: string
          minLength: 1
          maxLength: 80
        version:
          type: string
          minLength: 1
          maxLength: 32
        effective_at:
          type: string
          format: date
        status:
          type: string
          enum:
          - pending_legal_review
          - approved
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        text:
          type: string
          minLength: 1
          maxLength: 32768
          description: Markdown
    LegalState:
      type: object
      additionalProperties: false
      required:
      - documents
      - acceptance_required
      - marketing
      properties:
        documents:
          type: array
          description: The required documents, terms then privacy, with what this account last accepted.
          minItems: 2
          maxItems: 2
          items:
            type: object
            additionalProperties: false
            required:
            - kind
            - title
            - version
            - effective_at
            - status
            - sha256
            - accepted_version
            - accepted_at
            properties:
              kind:
                type: string
                enum:
                - terms
                - privacy
                - marketing
              title:
                type: string
                minLength: 1
                maxLength: 80
              version:
                type: string
                minLength: 1
                maxLength: 32
              effective_at:
                type: string
                format: date
              status:
                type: string
                enum:
                - pending_legal_review
                - approved
              sha256:
                type: string
                pattern: ^[0-9a-f]{64}$
              accepted_version:
                type:
                - string
                - 'null'
                maxLength: 32
              accepted_at:
                type:
                - string
                - 'null'
                format: date-time
        acceptance_required:
          type: boolean
          description: True when a required document's current version has not been accepted; the app asks again.
        marketing:
          type: object
          additionalProperties: false
          required:
          - granted
          - version
          - updated_at
          properties:
            granted:
              type: boolean
            version:
              type: string
              minLength: 1
              maxLength: 32
            updated_at:
              type:
              - string
              - 'null'
              format: date-time
    StepUpProof:
      type: object
      additionalProperties: false
      required:
      - step_up_token
      - purpose
      - expires_at
      properties:
        step_up_token:
          type: string
          minLength: 32
          maxLength: 128
        purpose:
          type: string
          minLength: 3
          maxLength: 64
        expires_at:
          type: string
          format: date-time
    ReauthenticationResponse:
      type: object
      additionalProperties: false
      required:
      - reauth_token
      - expires_at
      properties:
        reauth_token:
          type: string
          minLength: 32
          maxLength: 128
        expires_at:
          type: string
          format: date-time
    PrivacyRequestReceipt:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - access
          - deletion
        status:
          type: string
          enum:
          - received
          - in_review
          - processing
          - completed
          - declined
        created_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        created_at: &id005
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - roles
      - created_at
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        accepted:
          type: object
          description: Decision B. The versions of the required documents the person read and accepted.
          additionalProperties: false
          required:
          - terms
          - privacy
          properties:
            terms:
              type: string
              minLength: 1
              maxLength: 32
            privacy:
              type: string
              minLength: 1
              maxLength: 32
        marketing_consent:
          type: boolean
          default: false
          description: Optional and separate. Never implied by accepting the terms or the privacy notice.
      required:
      - email
      - password
      - display_name
      - accepted
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required:
      - mfa_required
      - challenge_token
      - expires_in
      properties:
        mfa_required:
          const: true
        challenge_token:
          type: string
          minLength: 32
          maxLength: 128
        expires_in:
          const: 300
    MfaVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_token
      - code
      properties:
        challenge_token:
          type: string
          minLength: 32
          maxLength: 128
        code:
          type: string
          description: Six-digit TOTP for the current server-aligned 30-second period only, or one-use recovery
            code; never logged
          pattern: ^(?:[0-9]{6}|[a-zA-Z0-9_-]{32,128})$
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          enum:
          - Bearer
        refresh_token:
          type: string
      required:
      - access_token
      - expires_in
      - token_type
      - refresh_token
      - user
    PilotCreatorApplication:
      type: object
      additionalProperties: false
      required:
      - account_id
      - status
      - creator_id
      properties:
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - invited
          - pending
          - approved
          - rejected
          - revoked
          description: '`revoked` appears only in the administrator revocation response; the applicant sees a revoked
            invitation as 404.'
        creator_id:
          type:
          - string
          - 'null'
          format: uuid
    PilotOutstandingCreatorInvitation:
      description: An invited account that has not applied, as shown to administrators.
      type: object
      additionalProperties: false
      required:
      - account_id
      - status
      - creator_id
      - invited_at
      properties:
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - invited
        creator_id:
          type: 'null'
        invited_at:
          type: string
          format: date-time
    PilotPendingCreatorApplication:
      description: A submitted application as shown to reviewers, with the handle and submission time needed to
        decide.
      type: object
      additionalProperties: false
      required:
      - account_id
      - status
      - creator_id
      - handle
      - submitted_at
      properties:
        account_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending
        creator_id:
          type: string
          format: uuid
        handle:
          type: string
          pattern: ^[a-z0-9_]{3,30}$
        submitted_at:
          type: string
          format: date-time
    Creator:
      type: object
      description: Public creator profile. It never includes the internal account id.
      additionalProperties: false
      required:
      - id
      - handle
      - display_name
      - bio
      - location
      - status
      - published_video_count
      - follower_count
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
          description: Existing handles are preserved; new handles and updates must match ^[a-z0-9_]{3,30}$.
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 80
        status:
          type: string
          enum:
          - active
        published_video_count:
          type: integer
          minimum: 0
        follower_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Null when engagement counts are unavailable.
    CreatorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 80
        handle:
          type: string
          pattern: ^[a-z0-9_]{3,30}$
    Video:
      type: object
      additionalProperties: false
      required:
      - id
      - creator_id
      - title
      - description
      - category
      - tags
      - cover_time_ms
      - state
      - visibility
      - created_at
      - published_at
      - poster_url
      - like_count
      - play_count
      properties:
        id:
          type: string
          format: uuid
        creator_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
