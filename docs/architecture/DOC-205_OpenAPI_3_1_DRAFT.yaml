          - spam
          - harassment
          - copyright
          - harmful
          - other
        details:
          type: string
          maxLength: 2000
      required:
      - video_id
      - reason
    Report:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        video_id: *id001
        status:
          type: string
          enum:
          - open
          - triaged
          - resolved
          - dismissed
        created_at: *id002
      required:
      - id
      - video_id
      - status
    OwnReport:
      type: object
      additionalProperties: false
      required: [id, video_id, status, created_at, reason, details]
      properties:
        id: {type: string, format: uuid}
        video_id: {type: string, format: uuid}
        status: {type: string, enum: [open, triaged, resolved, dismissed]}
        created_at: {type: string, format: date-time}
        reason: {type: string, enum: [spam, harassment, copyright, harmful, other]}
        details: {type: string, maxLength: 2000}
    OwnAppeal:
      type: object
      additionalProperties: false
      required: [id, video_id, status, created_at, reason]
      properties:
        id: {type: string, format: uuid}
        video_id: {type: string, format: uuid}
        status: {type: string, enum: [open, denied, restored]}
        created_at: {type: string, format: date-time}
        reason: {type: string, minLength: 10, maxLength: 2000}
    PilotModerationAction:
      type: object
      additionalProperties: false
      required: [id, video_id, action, status]
      properties:
        id: {type: string, format: uuid}
        video_id: {type: string, format: uuid}
        action: {type: string, enum: [publish, reject, remove, dismiss, deny, restore]}
        status: {const: applied}
    PilotReportQueueItem:
      type: object
      required: [id, video_id, status, created_at, reason, details]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        video_id: {type: string, format: uuid}
        status: {const: open}
        created_at: {type: string, format: date-time}
        reason: {type: string}
        details: {type: string, maxLength: 2000}
    PilotAppeal:
      type: object
      additionalProperties: false
      required: [id, video_id, status, created_at]
      properties:
        id: {type: string, format: uuid}
        video_id: {type: string, format: uuid}
        status: {type: string, enum: [open, denied, restored]}
        created_at: {type: string, format: date-time}
    PilotAppealQueueItem:
      type: object
      required: [id, video_id, status, created_at, reason]
      additionalProperties: false
      properties:
        id: {type: string, format: uuid}
        video_id: {type: string, format: uuid}
        status: {const: open}
        created_at: {type: string, format: date-time}
        reason: {type: string, maxLength: 2000}
    PageVideos:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Video'
        next_cursor:
          type: [string, 'null']
          format: uuid
      required:
      - items
      - next_cursor
  responses:
    VideoUploadStatus:
      description: Current owner-visible upload or processing state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VideoUploadStatus'}
    PilotCreatorApplication:
      description: Pilot application summary
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PilotCreatorApplication'}
    LocalUnavailable:
      description: Local dependency unavailable; no internal details exposed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              detail:
                type: string
            required: [detail]
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient role, scope, or object ownership
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict or duplicate operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
