        contract. Optional subject fields must be paired non-null or absent/null; no arbitrary metadata or secrets are
        accepted.
  responses:
    VideoUploadStatus:
      description: Current owner-visible upload or processing state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/VideoUploadStatus'}
    PilotCreatorApplication:
      description: Pilot application summary
      content:
        application/json:
          schema: {$ref: '#/components/schemas/PilotCreatorApplication'}
    LocalUnavailable:
      description: Local dependency unavailable; no internal details exposed
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              detail:
                type: string
            required: [detail]
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient role, scope, or object ownership
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict or duplicate operation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
