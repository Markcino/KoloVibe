openapi: 3.1.0
info:
  title: Liberian Creator Platform — Release 1 API
  version: 1.0.0-draft
  description: >-
    Candidate R1 contract, not deployed. Only operations marked x-implementation
    local are implemented for isolated local testing. All other operations remain
    gated draft requirements. Local errors use application/json with a detail
    field, not the candidate Problem schema. Production identity remains subject
    to ADR-013. DEC-003 points routes are opt-in and local-only.
x-default-implementation: gated
servers:
- url: https://api.example.invalid/api/v1
  description: Placeholder; never use in production
tags:
- name: Identity
- name: Creators
- name: Content
- name: Engagement
- name: Points
- name: Moderation
- name: Operations
- name: Internal Events
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Identity
      summary: Register user
      operationId: post__auth_register
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
      description: Creates an inactive local account and sends a single-use verification code. Requires configured mail delivery.
  /auth/verification/resend:
    post:
      tags: [Identity]
      operationId: resendEmailVerification
      summary: Request another email verification code
      description: The response is identical for unknown, verified, or throttled addresses. An eligible request replaces every earlier code, after a 60-second cooldown and at most 3 emails per hour. Each email carries a new six-digit code that expires in 30 minutes.
      x-implementation: local
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '204':
          description: Request accepted without disclosing delivery or account state
        '400':
          description: Invalid email or request body
        '503':
          $ref: '#/components/responses/LocalUnavailable'
  /auth/verify:
    post:
      tags: [Identity]
      operationId: post__auth_verify
      x-implementation: local
      summary: Verify local account email with the six-digit code that was emailed
      description: |
        Send the address the code was mailed to together with the six digits. The code proves access to that mailbox and nothing more: it is **not** multifactor authentication and no session is issued.
        A code lives 30 minutes, works once, and is destroyed by its fifth wrong guess. An address that fails 10 times in an hour, or a trusted network origin that fails 40 times in 15 minutes, receives 429 until the window passes, even for a correct code. Unknown addresses, wrong, expired, used and exhausted codes all return the same 400. A bare long `code` (no `email`) is the retired link, honoured only for links already mailed before this contract and removed 24 hours after rollout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Invalid, expired, reused or unknown code or address (identical answers)
        '429':
          description: Too many attempts; try again later. Returned for known and unknown addresses alike.
        '503':
          description: Identity unavailable
  /auth/password/reset-request:
    post:
      tags: [Identity]
      operationId: requestPasswordReset
      x-implementation: local
      summary: Request a single-use password reset code
      description: Unknown, eligible and throttled accounts receive the same empty response, including delivery failure. An eligible account is mailed a six-digit code that expires in 15 minutes, after a 60-second cooldown and at most 3 emails per hour; a new code replaces earlier ones. Privileged account recovery requires a separate reviewed workflow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '204': {description: Request accepted}
        '400': {description: Invalid request}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
  /auth/password/reset:
    post:
      tags: [Identity]
      operationId: resetPassword
      x-implementation: local
      summary: Consume the six-digit reset code and revoke all account sessions
      description: >-
        Same limits as email verification. 5 wrong guesses destroy the code, 10 per address per hour and 40 per trusted origin per 15 minutes return 429. A weak new password is rejected without spending the code. No session is issued; the person signs in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, new_password]
              properties:
                email: {type: string, format: email, maxLength: 254, description: 'Required with a six-digit code, omitted only by the retired long link'}
                code:
                  oneOf:
                    - {type: string, pattern: '^[0-9]{6}$'}
                    - {type: string, minLength: 32, maxLength: 128, deprecated: true, description: 'Retired long link, accepted without email until it expires'}
                new_password: {type: string, minLength: 1, maxLength: 128}
      responses:
        '204': {description: Password changed and sessions revoked}
        '400': {description: Invalid or expired code or password}
        '429': {description: Too many attempts}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
  /auth/login:
    post:
      tags:
      - Identity
      summary: Authenticate user
      operationId: post__auth_login
      x-implementation: local
      responses:
        '202':
          description: Password accepted; privileged session requires MFA (approved staging capability only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/mfa/verify:
    post:
      tags:
      - Identity
      summary: Complete a password-bound privileged MFA challenge
      operationId: post__auth_mfa_verify
      x-implementation: staging-gated
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerificationRequest'
      responses:
        '200':
          description: MFA verified; privileged refresh cannot extend the 900-second reauthentication deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed gateway request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
  /auth/refresh:
    post:
      tags:
      - Identity
      summary: Rotate refresh token
      operationId: post__auth_refresh
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      description: >-
        Local gateway accepts a JSON refresh token. The web server reads it from
        an HttpOnly browser cookie; mobile uses OS secure storage. Single-use
        rotation and reuse-family revocation apply. Production remains gated.
  /auth/logout:
    post:
      tags:
      - Identity
      summary: Revoke current session
      operationId: post__auth_logout
      x-implementation: local
      security: []
      description: Revokes by bearer access token or JSON refresh token. No response body. Both access and refresh credentials are rejected on the next protected request; the gateway checks live identity session state without caching.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: Success; no response body
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
  /me/preferences:
    get:
      tags: [Identity]
      operationId: getMyPreferences
      x-implementation: local
      summary: Read the signed-in account notification preferences
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own notification preferences
          content:
            application/json:
              schema:
                type: object
                required: [email_notifications, push_notifications]
                properties:
                  email_notifications: {type: boolean}
                  push_notifications: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
    patch:
      tags: [Identity]
      operationId: updateMyPreferences
      x-implementation: local
      summary: Replace own notification preferences; delivery requires separate activation
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email_notifications, push_notifications]
              properties:
                email_notifications: {type: boolean}
                push_notifications: {type: boolean}
      responses:
        '200': {description: Updated own preferences}
        '400': {description: Invalid preference fields}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
  /me/privacy-requests:
    get:
      tags: [Identity]
      operationId: listMyPrivacyRequests
      x-implementation: local
      summary: List up to 40 most recent own privacy request receipts
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Own privacy request records, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 40
                    items: {$ref: '#/components/schemas/PrivacyRequestReceipt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
    post:
      tags: [Identity]
      operationId: requestMyPrivacyAction
      x-implementation: local
      summary: Receive an access or deletion request without executing it
      description: >-
        Consume a five-minute, single-use reauth_token bound to this account and
        current login session. current_password remains accepted for compatibility,
        with the same account-wide reauthentication attempt budget. If both are
        supplied, the token takes precedence with no password fallback. A valid
        token is consumed even when an open request returns 409. Only received or
        in_review requests block another request of the same kind. Existing
        received receipts retain their status. Deletion is intake-only under
        ADR-020; this operation never disables accounts or purges data.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              anyOf:
              - required: [reauth_token]
              - required: [current_password]
              properties:
                kind: {type: string, enum: [access, deletion]}
                reauth_token: {type: string, minLength: 32, maxLength: 128}
                current_password: {type: string, minLength: 1, maxLength: 128, deprecated: true}
      responses:
        '201':
          description: Request received without performing the requested action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrivacyRequestReceipt'}
        '400': {description: Invalid request or generic reauthentication failure}
        '409':
          description: Another open request of this kind exists for the account
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [detail, code]
                properties:
                  detail: {type: string}
                  code: {const: request_open}
        '429': {$ref: '#/components/responses/RateLimited'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
  /me/reauthenticate:
    post:
      tags: [Identity]
      operationId: reauthenticateMyAccount
      x-implementation: local
      summary: Confirm the current password for one sensitive request
      description: >-
        Issues a random token stored only as a keyed digest, bound to the account
        and current login session. Expires after five minutes and is single-use.
        All attempts, including successful issuance, share an account-wide limit
        of five attempts per fifteen minutes with the legacy privacy password
        path and password changes. Success records account.reauthenticated in the identity audit outbox.
        No password or token is included in audit events.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password]
              properties:
                current_password: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Session-bound reauthentication proof; response must not be cached
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReauthenticationResponse'}
        '400': {description: Generic reauthentication failure; no credential detail disclosed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
  /me/sessions:
    get:
      tags: [Identity]
      operationId: listMySessions
      summary: List up to 40 most recent active sessions for the signed-in account
      x-implementation: local
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Active sessions without credentials
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 40
                    items:
                      type: object
                      required: [id, created_at, expires_at, current]
                      properties:
                        id: {type: string, format: uuid}
                        created_at: {type: string, format: date-time}
                        expires_at: {type: string, format: date-time}
                        current: {type: boolean}
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/password:
    patch:
      tags: [Identity]
      operationId: changeMyPassword
      x-implementation: local
      summary: Change the signed-in account password and revoke other sessions
      description: >-
        Requires the current password. Preserves the current login session and
        revokes every other session. Outstanding reauthentication proofs are
        invalidated. Reset-password recovery separately revokes all sessions.
        Gateway checks live identity session state on each protected request;
        revoked access and refresh tokens are rejected immediately, even inside
        the signed access token's 300-second lifetime.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string, minLength: 1, maxLength: 128}
                new_password: {type: string, minLength: 1, maxLength: 128}
      responses:
        '204': {description: Password changed and other sessions revoked}
        '400': {description: Invalid password change}
        '429': {$ref: '#/components/responses/RateLimited'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
  /me/sessions/{session_id}:
    delete:
      tags: [Identity]
      operationId: revokeMySession
      summary: Revoke another active session for the signed-in account
      x-implementation: local
      security: [{bearerAuth: []}]
      parameters:
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '204':
          description: Session revoked
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Session unavailable to this account
        '409':
          description: Use sign out to end the current session
  /me:
    patch:
      tags: [Identity]
      operationId: updateMyProfile
      x-implementation: local
      summary: Update own display name
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: {type: string, minLength: 2, maxLength: 80}
      responses:
        '200':
          description: Updated own account
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {description: Invalid display name}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/LocalUnavailable'}
    get:
      tags:
      - Identity
      summary: Get current account
      operationId: get__me
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
  /creator-invitations:
    post:
      tags: [Creators]
      summary: Invite a pilot account
      operationId: post_creator_invitation
      x-implementation: staging-gated
      x-required-roles: [moderator, administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id]
              properties:
                account_id: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/PilotCreatorApplication'}
        '200': {$ref: '#/components/responses/PilotCreatorApplication'}
        '400': {description: Invalid account identifier or request}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creator-applications:
    get:
      tags: [Creators]
      summary: List pending pilot applications
      operationId: get_creator_applications
      x-implementation: staging-gated
      x-required-roles: [moderator, administrator]
      parameters:
      - name: cursor
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Page of pending applications
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: {$ref: '#/components/schemas/PilotCreatorApplication'}
                  next_cursor: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid cursor}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creator-applications/{account_id}/decision:
    parameters:
    - name: account_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      tags: [Creators]
      summary: Approve or reject a pending application
      operationId: post_creator_application_decision
      description: >-
        Approval confirms live account-bound Creator eligibility and synchronizes the
        Identity creator role. A role change revokes existing sessions. If synchronization
        fails after approval commits, return 503; retrying the same review is safe.
      x-implementation: staging-gated
      x-required-roles: [moderator, administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
      responses:
        '200': {$ref: '#/components/responses/PilotCreatorApplication'}
        '400': {description: Invalid decision}
        '404': {description: Application not found}
        '409': {description: Application or profile cannot be reviewed}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creators/me/application:
    get:
      tags:
      - Creators
      summary: Read own pilot application
      operationId: get_own_creator_application
      x-implementation: staging-gated
      x-required-roles:
      - viewer
      - creator
      responses:
        '200':
          $ref: '#/components/responses/PilotCreatorApplication'
        '400':
          description: Unexpected request data
        '404':
          description: Application or invitation not found
        '401':
          description: Missing or invalid session
        '403':
          description: Role or creator eligibility requirements not met
        '503':
          description: Required service unavailable
    post:
      tags:
      - Creators
      summary: Submit own invited application with verified email
      operationId: post_own_creator_application
      x-implementation: staging-gated
      x-required-roles:
      - viewer
      - creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - handle
              - adult_attested
              - rights_attested
              properties:
                handle:
                  type: string
                  pattern: ^[a-z0-9_]{3,30}$
                adult_attested:
                  const: true
                rights_attested:
                  const: true
      responses:
        '201':
          $ref: '#/components/responses/PilotCreatorApplication'
        '200':
          $ref: '#/components/responses/PilotCreatorApplication'
        '400':
          description: Invalid handle or missing attestations
        '409':
          description: Application or handle conflict
        '401':
          description: Missing or invalid session
        '403':
          description: Role or creator eligibility requirements not met
        '503':
          description: Required service unavailable
  /creators/me/upload-eligibility:
    get:
      tags: [Creators]
      summary: Read own pilot upload eligibility
      operationId: get_own_creator_upload_eligibility
      description: >-
        An eligible account whose Identity role is still viewer is synchronized through
        the signed internal workflow. Its old sessions are revoked and this request returns
        401; sign in again before opening Studio. Ineligible viewers remain unchanged.
      x-implementation: staging-gated
      x-required-roles: [viewer, creator]
      responses:
        '200':
          description: Current upload eligibility
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [upload_eligible, creator_id]
                properties:
                  upload_eligible: {type: boolean}
                  creator_id: {type: [string, 'null'], format: uuid}
        '400': {description: Unexpected request data}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creators/search:
    get:
      tags:
      - Creators
      operationId: searchCreators
      summary: Search reviewed active creator handles and display names
      description: Case-insensitive substring search. Reuse the same query for each page.
      x-implementation: local
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: cursor
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Up to 20 matching profiles in ascending identifier order
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/CreatorSearchItem'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    format: uuid
        '400':
          description: Invalid query or cursor
        '503':
