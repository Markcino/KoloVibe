      tags: [Operations]
      operationId: getAppCompatibility
      x-implementation: local
      summary: Read public native app version compatibility
      description: >-
        Strict SemVer 2.0 parsing and numeric precedence, including prereleases;
        build metadata does not affect comparison. Below minimum returns
        update_required, below latest returns update_available, and otherwise a
        known version bound returns supported. With no version bounds status is
        unknown. With no configuration all three policy fields are null. Each
        platform has optional KOLOVIBE_APP_MIN_VERSION_IOS or ANDROID,
        KOLOVIBE_APP_LATEST_VERSION_IOS or ANDROID and KOLOVIBE_APP_STORE_URL_IOS or
        ANDROID environment settings. Store URLs must use HTTPS and configuration
        is validated at settings load; minimum cannot exceed latest. No account
        or identity-service call is required. Repeated or unknown query parameters
        are rejected.
      security: []
      parameters:
      - name: platform
        in: query
        required: true
        schema: {type: string, enum: [ios, android]}
      - name: version
        in: query
        required: true
        description: Semantic version such as 1.2.3 or 1.2.3-rc.1+build.7
        schema: {type: string, minLength: 5, maxLength: 128}
      responses:
        '200':
          description: Platform-specific compatibility policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppCompatibility'}
        '400': {description: 'Missing, repeated or invalid compatibility parameters'}
  /health/live:
    get:
      tags:
      - Operations
      summary: Process liveness
      operationId: get__health_live
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: Success; no response body
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
  /health/ready:
    get:
      tags:
      - Operations
      summary: Dependency readiness
      operationId: get__health_ready
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: Success; no response body
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      description: Not exposed publicly through Nginx; only cluster health checks.
  /videos/{video_id}/shares:
    post:
      tags:
      - Engagement
      operationId: recordVideoShare
      summary: Record one authenticated share intent per UTC day
      x-implementation: local
      x-capability: engagement
      x-required-roles:
      - viewer
      - creator
      description: Requires a currently published public non-deleted video from Content. Request body and query parameters
        are not accepted. The gateway records at most one share per account/video/UTC day and returns KOLOVIBE_PUBLIC_WEB_ORIGIN
        + /videos/<id>. The configured origin must be an HTTPS origin without credentials, path, query or fragment,
        and is validated at settings load. An unconfigured origin returns 503 share_unavailable and records no share.
        A share is an intent, not evidence of delivery to another service; it emits no points or qualification event.
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Canonical link; repeated same-day requests have the same result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          description: Unexpected request data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No published public non-deleted video
        '503':
          description: Sharing is unconfigured or unavailable; pre-recording dependency failures retain their existing
            unavailable response
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ShareUnavailable'
                - type: object
                  additionalProperties: false
                  required:
                  - detail
                  properties:
                    detail:
                      type: string
  /creators/me/points/entries/{entry_id}:
    get:
      tags:
      - Points
      operationId: getOwnPointsEntry
      summary: Read own retained points entry or qualification receipt
      x-implementation: local
      x-capability: points
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Requires verified email and creator ownership. Returns 404 for foreign IDs. No request body/query
        accepted and no client mutation route exists.
      responses:
        '200':
          description: Own entry or receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsEntry'
        '400':
          description: Invalid or unexpected request data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Owned record not found
        '503':
          description: A required service is unavailable
  /creators/me/videos/{video_id}/notice:
    get:
      tags:
      - Moderation
      operationId: getOwnVideoNotice
      summary: Read latest applied decision and own appeal
      x-implementation: local
      x-capability: moderation
      x-required-roles:
      - creator
      description: Owner creator only, including restricted/suspended creators. Content verifies current owner and
        non-deletion; foreign/deleted video returns 404. Uses latest applied publish/reject/remove/restrict/restore
        action ordered by finish time, creation time and UUID; dismiss/deny do not replace a video decision. Initial
        publish maps to none; no action means none with null reason/date. Historical missing reason codes remain null.
        Only current removal with matching revision and no filed appeal is appealable; rejected content is not appealable
        under existing DEC-005. restricted requires a real applied restrict action; this change does not add a restriction
        decision route. Returns only this account's appeal.
      parameters:
      - name: video_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Latest attributable decision and own appeal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoNotice'
        '400':
          description: Invalid or unexpected request data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Owned record not found
        '503':
          description: A required service is unavailable
  /me/standing:
    get:
      tags:
      - Moderation
      operationId: getOwnStanding
      summary: Read live account and creator standing
      x-implementation: local
      x-capability: moderation
      description: 'Composes minimal signed identity session context, creator status/eligibility and up to 20 recent
        latest applied video decisions. Private to the current account; no scope/body/query overrides. Current Content
        ownership/non-deletion is rechecked before revealing notices. No creator profile means null creator_status,
        false publishing_allowed and no notices. Legacy ownership is never guessed: up to 20 unattributed latest actions
        are resolved via Content; larger legacy backlogs or the bounded time budget return 503 until backfill_action_owners
        has been run. Missing/deleted legacy content can be marked checked by that command without inventing an owner.'
      responses:
        '200':
          description: Live standing and private notices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountStanding'
        '400':
          description: Invalid or unexpected request data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: A required service is unavailable
  /internal/security-events:
    servers:
    - url: https://audit.internal.invalid
      description: Private service origin placeholder; never exposed through the public gateway
    post:
      tags:
      - Internal Events
      operationId: ingestAuditEvent
      summary: Idempotently retain immutable producer audit evidence
      x-implementation: local
      x-internal-only: true
      x-authentication: Per-producer HMAC SHA-256, audience/method/path/body binding, 60-second timestamp and single-use
        nonce
      description: Accepts identity, moderation, creators, content and points, constrained by per-producer kind allow-lists.
        Distinct caller keys are required. ID replay with identical payload from the same producer is 200; producer/payload
        collision is 409. Unknown caller is 403; invalid kind/subject/shape is 400. Moderation decisions, reports
        and appeals atomically create immutable producer events plus AuditDelivery rows; deliver_audit_events uses
        two-second requests, bounded batches (1..1000), capped one-hour exponential retry delay, and retains failed
        deliveries indefinitely. Points atomically creates points.awarded and points.withheld events (null actor, subject_type points_entry, subject_id the qualification event id) with AuditDelivery rows and delivers them with its own deliver_audit_events. Creators and content are accepted by ingest; this change does not add their producers/outboxes.
      security:
      - internalCaller: []
        internalTimestamp: []
        internalNonce: []
        internalSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditInternalEvent'
      responses:
        '201':
          description: Event stored
        '200':
          description: Identical producer event replay acknowledged
        '400':
          description: Invalid event or kind/subject not allowed
        '403':
          description: Unapproved or invalid producer signature
        '409':
          description: ID collision with different content or producer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Django-signed
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Workload token, audience- and scope-bound; mTLS required for internal APIs.
    internalCaller:
      type: apiKey
      in: header
      name: X-KoloVibe-Caller
    internalTimestamp:
      type: apiKey
      in: header
      name: X-KoloVibe-Timestamp
    internalNonce:
      type: apiKey
      in: header
      name: X-KoloVibe-Nonce
    internalSignature:
      type: apiKey
      in: header
      name: X-KoloVibe-Signature
  schemas:
    Problem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type: string
      required:
      - type
      - title
      - status
      - code
      - request_id
    RegistrationResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        verification_required:
          const: true
      required: [id, verification_required]
    VerificationRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Address the code was mailed to. Required with a six-digit code.
        code:
          oneOf:
            - type: string
              pattern: '^[0-9]{6}$'
              description: Six-digit code from the email. Never logged.
            - type: string
              minLength: 32
              maxLength: 128
              deprecated: true
              description: Retired long link, accepted without email until it expires.
      required: [code]
    VerificationResponse:
      type: object
      additionalProperties: false
      properties:
        verified:
          const: true
      required: [verified]
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 32
          maxLength: 128
      required: [refresh_token]
    AppCompatibility:
      type: object
      additionalProperties: false
      required: [status, minimum_version, latest_version, store_url]
      properties:
        status: {type: string, enum: [unknown, supported, update_available, update_required]}
        minimum_version: {type: [string, 'null'], maxLength: 128}
        latest_version: {type: [string, 'null'], maxLength: 128}
        store_url: {type: [string, 'null'], format: uri, pattern: '^[Hh][Tt][Tt][Pp][Ss]://', maxLength: 2048}
      example:
        status: unknown
        minimum_version: null
        latest_version: null
        store_url: null
    ReauthenticationResponse:
      type: object
      additionalProperties: false
      required: [reauth_token, expires_at]
      properties:
        reauth_token: {type: string, minLength: 32, maxLength: 128}
        expires_at: {type: string, format: date-time}
    PrivacyRequestReceipt:
      type: object
      additionalProperties: false
      required: [id, kind, status, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [access, deletion]}
        status: {type: string, enum: [received, in_review, completed, declined]}
        created_at: {type: string, format: date-time}
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
        created_at: &id002
          type: string
          format: date-time
      required:
      - id
      - email
      - display_name
      - roles
      - created_at
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          minLength: 2
          maxLength: 80
      required:
      - email
      - password
      - display_name
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required: [mfa_required, challenge_token, expires_in]
      properties:
        mfa_required:
          const: true
        challenge_token:
          type: string
          minLength: 32
          maxLength: 128
        expires_in:
          const: 300
    MfaVerificationRequest:
      type: object
      additionalProperties: false
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
          minLength: 32
          maxLength: 128
        code:
          type: string
          description: Six-digit TOTP or one-use recovery code; never logged
          pattern: '^(?:[0-9]{6}|[a-zA-Z0-9_-]{32,128})$'
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        access_token:
          type: string
        expires_in:
          type: integer
        token_type:
          type: string
          enum:
          - Bearer
        refresh_token:
          type: string
      required:
      - access_token
      - expires_in
      - token_type
      - refresh_token
      - user
    PilotCreatorApplication:
      type: object
      additionalProperties: false
      required: [account_id, status, creator_id]
      properties:
        account_id: {type: string, format: uuid}
        status: {type: string, enum: [invited, pending, approved, rejected]}
        creator_id: {type: [string, 'null'], format: uuid}
    Creator:
      type: object
      description: Public creator profile. It never includes the internal account id.
      additionalProperties: false
      required:
      - id
      - handle
      - display_name
      - bio
      - location
      - status
      - published_video_count
      - follower_count
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
          pattern: ^[a-zA-Z0-9_-]{1,40}$
          description: Existing handles are preserved; new handles and updates must match ^[a-z0-9_]{3,30}$.
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 80
        status:
          type: string
          enum:
          - active
        published_video_count:
          type: integer
          minimum: 0
        follower_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Null when engagement counts are unavailable.
    CreatorUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          maxLength: 80
        bio:
          type: string
          maxLength: 500
        location:
          type: string
          maxLength: 80
        handle:
          type: string
          pattern: ^[a-z0-9_]{3,30}$
    Video:
      type: object
      additionalProperties: false
      required:
      - id
      - creator_id
      - title
      - description
      - category
      - tags
      - cover_time_ms
      - state
      - visibility
      - created_at
      - published_at
      - poster_url
      - like_count
      - play_count
      properties:
        id:
          type: string
          format: uuid
        creator_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        category:
          type:
          - string
          - 'null'
          enum:
          - hipco
          - afrobeats
          - comedy
          - skits
          - short_films
          - culture
          - documentaries
          - null
          description: Null only for existing rows without a category.
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9_]{1,30}$
          description: 'Stored lowercase without a leading #; trim, normalize and deduplicate input while preserving
            order.'
        cover_time_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 300000
          description: Must not exceed known duration_ms. Unknown draft duration is checked during processing.
        state:
          const: published
        visibility:
          const: public
        created_at:
          type: string
          format: date-time
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        poster_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 4096
          description: Private R2 JPEG signed for at most 300 seconds, or null. Never persist this URL.
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 300
        duration_ms:
          type: integer
          minimum: 1
          maximum: 300000
        like_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Null when engagement counts are unavailable.
        play_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: All-time server-qualified plays (D-9). Null when Engagement is unavailable; clients show no label for null or zero.
    OwnVideoDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - creator_id
      - title
      - description
      - category
      - tags
      - cover_time_ms
      - state
      - visibility
      - created_at
      - published_at
      - poster_url
      - revision
      properties:
        id:
          type: string
          format: uuid
        creator_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
        category:
          type:
          - string
          - 'null'
          enum:
          - hipco
          - afrobeats
          - comedy
          - skits
          - short_films
          - culture
          - documentaries
          - null
          description: Null only for existing rows without a category.
        tags:
          type: array
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9_]{1,30}$
          description: 'Stored lowercase without a leading #; trim, normalize and deduplicate input while preserving
            order.'
        cover_time_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 300000
          description: Must not exceed known duration_ms. Unknown draft duration is checked during processing.
        state:
          type: string
          enum:
          - draft
          - uploading
          - processing
          - failed
          - review
          - published
          - rejected
          - removed
        visibility:
          type: string
          enum:
          - private
          - public
          - unlisted
        created_at:
          type: string
          format: date-time
        published_at:
          type:
          - string
          - 'null'
          format: date-time
        poster_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 4096
          description: Private R2 JPEG signed for at most 300 seconds, or null. Never persist this URL.
        duration_seconds:
          type: integer
          minimum: 0
          maximum: 300
        duration_ms:
          type: integer
          minimum: 1
          maximum: 300000
        revision:
          type: integer
          minimum: 0
    CreatorContentAnalytics:
