openapi: 3.1.0
info:
  title: Liberian Creator Platform — Release 1 API
  version: 1.0.0-draft
  description: >-
    Candidate R1 contract, not deployed. Only operations marked x-implementation
    local are implemented for isolated local testing. All other operations remain
    gated draft requirements. Local errors use application/json with a detail
    field, not the candidate Problem schema. Production identity remains subject
    to ADR-013. All points operations remain disabled.
x-default-implementation: gated
servers:
- url: https://api.example.invalid/api/v1
  description: Placeholder; never use in production
tags:
- name: Identity
- name: Creators
- name: Content
- name: Engagement
- name: Points
- name: Moderation
- name: Operations
- name: Internal Events
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Identity
      summary: Register user
      operationId: post__auth_register
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
      description: Creates an inactive local account and sends a single-use verification code. Requires configured mail delivery.
  /auth/verify:
    post:
      tags: [Identity]
      operationId: post__auth_verify
      x-implementation: local
      summary: Verify local account email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResponse'
        '400':
          description: Invalid, expired or reused code
        '503':
          description: Identity unavailable
  /auth/login:
    post:
      tags:
      - Identity
      summary: Authenticate user
      operationId: post__auth_login
      x-implementation: local
      responses:
        '202':
          description: Password accepted; privileged session requires MFA (approved staging capability only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/mfa/verify:
    post:
      tags:
      - Identity
      summary: Complete a password-bound privileged MFA challenge
      operationId: post__auth_mfa_verify
      x-implementation: staging-gated
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerificationRequest'
      responses:
        '200':
          description: MFA verified; privileged refresh cannot extend the 900-second reauthentication deadline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Malformed gateway request
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/LocalUnavailable'
  /auth/refresh:
    post:
      tags:
      - Identity
      summary: Rotate refresh token
      operationId: post__auth_refresh
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      description: >-
        Local gateway accepts a JSON refresh token. The web server reads it from
        an HttpOnly browser cookie; mobile uses OS secure storage. Single-use
        rotation and reuse-family revocation apply. Production remains gated.
  /auth/logout:
    post:
      tags:
      - Identity
      summary: Revoke current session
      operationId: post__auth_logout
      x-implementation: local
      security: []
      description: Revokes by bearer access token or JSON refresh token. No response body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '204':
          description: Success; no response body
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
  /me:
    get:
      tags:
      - Identity
      summary: Get current account
      operationId: get__me
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
  /creator-invitations:
    post:
      tags: [Creators]
      summary: Invite a pilot account
      operationId: post_creator_invitation
      x-implementation: staging-gated
      x-required-roles: [moderator, administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id]
              properties:
                account_id: {type: string, format: uuid}
      responses:
        '201': {$ref: '#/components/responses/PilotCreatorApplication'}
        '200': {$ref: '#/components/responses/PilotCreatorApplication'}
        '400': {description: Invalid account identifier or request}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creator-applications:
    get:
      tags: [Creators]
      summary: List pending pilot applications
      operationId: get_creator_applications
      x-implementation: staging-gated
      x-required-roles: [moderator, administrator]
      parameters:
      - name: cursor
        in: query
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Page of pending applications
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: {$ref: '#/components/schemas/PilotCreatorApplication'}
                  next_cursor: {type: [string, 'null'], format: uuid}
        '400': {description: Invalid cursor}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creator-applications/{account_id}/decision:
    parameters:
    - name: account_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    post:
      tags: [Creators]
      summary: Approve or reject a pending application
      operationId: post_creator_application_decision
      x-implementation: staging-gated
      x-required-roles: [moderator, administrator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approved, rejected]}
      responses:
        '200': {$ref: '#/components/responses/PilotCreatorApplication'}
        '400': {description: Invalid decision}
        '404': {description: Application not found}
        '409': {description: Application or profile cannot be reviewed}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creators/me/application:
    get:
      tags: [Creators]
      summary: Read own pilot application
      operationId: get_own_creator_application
      x-implementation: staging-gated
      x-required-roles: [viewer, creator]
      responses:
        '200': {$ref: '#/components/responses/PilotCreatorApplication'}
        '400': {description: Unexpected request data}
        '404': {description: Application or invitation not found}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
    post:
      tags: [Creators]
      summary: Submit own invited application with verified email
      operationId: post_own_creator_application
      x-implementation: staging-gated
      x-required-roles: [viewer, creator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handle, adult_attested, rights_attested]
              properties:
                handle: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
                adult_attested: {const: true}
                rights_attested: {const: true}
      responses:
        '201': {$ref: '#/components/responses/PilotCreatorApplication'}
        '200': {$ref: '#/components/responses/PilotCreatorApplication'}
        '400': {description: Invalid handle or missing attestations}
        '409': {description: Application or handle conflict}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creators/me/upload-eligibility:
    get:
      tags: [Creators]
      summary: Read own pilot upload eligibility
      operationId: get_own_creator_upload_eligibility
      x-implementation: staging-gated
      x-required-roles: [viewer, creator]
      responses:
        '200':
          description: Current upload eligibility
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [upload_eligible, creator_id]
                properties:
                  upload_eligible: {type: boolean}
                  creator_id: {type: [string, 'null'], format: uuid}
        '400': {description: Unexpected request data}
        '401': {description: Missing or invalid session}
        '403': {description: Role or creator eligibility requirements not met}
        '503': {description: Required service unavailable}
  /creators/{creator_id}:
    get:
      tags:
      - Creators
      summary: Get public creator profile
      operationId: get__creators_creator_id
      x-implementation: local
      responses:
        '404':
          description: No approved public creator
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      parameters:
      - name: creator_id
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /creators/me:
    patch:
      tags:
      - Creators
      summary: Edit own creator profile
      operationId: patch__creators_me
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Creator'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatorUpdate'
      x-required-roles:
      - creator
  /videos:
    post:
      tags:
      - Content
      summary: Create private draft video metadata
      description: Requires current approved creator eligibility from DEC-004.
      operationId: post__videos
      x-implementation: local-only
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCreate'
      x-required-roles: [viewer, creator]
      x-required-creator-eligibility: true
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
    get:
      tags:
      - Content
      summary: List published videos
      operationId: get__videos
      x-implementation: local
      responses:
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVideos'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: creator_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
  /videos/{video_id}:
    get:
      tags:
      - Content
      summary: Get video details
      operationId: get__videos_video_id
      x-implementation: local
      responses:
        '404':
          description: No approved public video
        '503':
          $ref: '#/components/responses/LocalUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      parameters:
      - name: video_id
        in: path
        required: true
        schema: *id001
      description: Only approved public published metadata is readable locally. All other records return 404. No playback credentials are returned.
    patch:
      tags:
      - Content
      summary: Edit own draft video
      operationId: patch__videos_video_id
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoCreate'
      x-required-roles:
      - creator
      parameters:
      - name: video_id
        in: path
        required: true
        schema: *id001
  /videos/{video_id}/upload-intents:
    post:
      tags:
      - Content
      summary: Reserve a conditional direct R2 upload
      operationId: post__videos_video_id_upload-intents
      x-implementation: local-only
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [size_bytes], properties: {size_bytes: {type: integer, minimum: 1, maximum: 52428800}}}
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          description: Invalid request
        '404':
          description: Video is not available for the operation
        '503':
          description: Required service unavailable
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      x-required-roles: [viewer, creator]
      x-required-creator-eligibility: true
      parameters:
      - name: video_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      description: Requires current approved creator eligibility and ownership of the private draft.
        Reusing the same idempotency key and size returns a link for the same object until expiry.
  /videos/{video_id}/upload-status:
    parameters:
    - name: video_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    get:
      tags: [Content]
      summary: Read own upload or processing state
      operationId: get_video_upload_status
      x-implementation: local-only
      responses:
        '200': {$ref: '#/components/responses/VideoUploadStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Video not found}
        '503': {description: Media temporarily unavailable}
    post:
      tags: [Content]
      summary: Confirm own upload and enqueue processing
      operationId: post_video_upload_complete
      x-implementation: local-only
      responses:
        '200': {$ref: '#/components/responses/VideoUploadStatus'}
        '202': {$ref: '#/components/responses/VideoUploadStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Video not found}
        '409': {description: Upload not available or does not match its reservation}
        '503': {description: Retry the same completion request if media or queue is temporarily unavailable}
  /videos/{video_id}/publish:
    post:
      tags:
      - Content
      summary: Request publication after processing/moderation
      x-implementation: gated
      description: Pilot publication uses the DEC-005 reviewer decision route.
      operationId: post__videos_video_id_publish
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      x-required-roles:
      - creator
      parameters:
      - name: video_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
  /videos/{video_id}/unpublish:
    post:
      tags:
      - Content
      summary: Unpublish owned video
      operationId: post__videos_video_id_unpublish
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Video'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      x-required-roles:
      - creator
      parameters:
      - name: video_id
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
  /videos/{video_id}/playback:
    get:
      tags:
      - Content
      summary: Obtain authorized short-lived playback URL
      description: Requires sign-in and an approved public video with a private R2 playback rendition.
      operationId: get__videos_video_id_playback
      x-implementation: local-only
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
        '400':
          description: Invalid request
        '404':
          description: Video is not available for the operation
        '503':
          description: Required service unavailable
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      parameters:
      - name: video_id
        in: path
        required: true
        schema: *id001
  /engagement/watch-events:
    post:
      tags:
      - Engagement
      summary: Submit untrusted watch telemetry for server validation
      operationId: post__engagement_watch-events
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '202':
          description: Accepted for asynchronous qualification
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchEvent'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
      description: 202 Accepted. Telemetry alone never grants points; server checks signed sessions, playback
        evidence and abuse signals.
  /videos/{video_id}/like:
    put:
      tags:
      - Engagement
      x-implementation: local-only
      summary: Like video once per user
      description: Available to authenticated viewer and creator accounts for public, published videos.
      operationId: put__videos_video_id_like
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
