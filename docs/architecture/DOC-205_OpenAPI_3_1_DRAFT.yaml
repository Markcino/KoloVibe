          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVideos'
        '400':
          description: Invalid request; application/problem+json
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          description: Unexpected server error; no internal details exposed
      security: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        description: Case-insensitive substring in the title or description of published videos. Reuse the same filters
          when paginating.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - name: creator_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: category
        in: query
        schema:
          type: string
          enum:
          - hipco
          - afrobeats
          - comedy
          - skits
          - short_films
          - culture
          - documentaries
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recent
          - trending
          - popular
          default: recent
      description: |
        Public catalogue with existing q/creator_id/category/cursor semantics. Trending ranks real qualified
        plays in the preceding rolling seven days, breaks ties by ascending video UUID, then verifies current published/public/non-deleted
        state through Content before selecting up to twenty IDs. Signed cursors hold the ranking cutoff fixed while
        skipping hidden candidates. The client bounds candidate scans and its time budget and returns unavailable
        rather than a partial ranking on exhaustion; unavailable ranking/lookup returns 503. Trending does not accept
        cursor and always returns next_cursor null. Like counts are read in a signed batch and remain null when Engagement
        is unavailable.

        **sort=popular (D-6)** is a per-creator order and requires `creator_id` and nothing else (no q, category or
        cursor): any other combination is 400. Content supplies the creator's publicly eligible videos
        (published, public, moderation-approved, not deleted); Engagement supplies `play_count`. Order is `play_count`
        descending, ties broken by Content's newest-first order (created_at, then id), so repeated requests return the
        same order. At most 20 items, `next_cursor` null. It is **not** global trending relabelled: it ranks one creator's
        videos by all-time qualified plays. A creator with more than 200 public videos, or an unavailable aggregate, returns
        503 instead of a guessed order. Responses are `no-store`.

        **play_count (D-9)** is the number of server-qualified plays of a public video, all time: a viewer's session
        reached 80 % of the video or 30 s, whichever is less, with validated forward progress, once per viewer per
        24 h, never the creator's own view. It is the same aggregate that ranks Trending and Popular and that the creator
        sees as `qualified_plays`. Only this number is public: no viewer identity, session, timestamp, watch time,
        anti-abuse signal or creator analytics. Label in the app: `1 play`, `2 plays`, `1.2K plays`, `3.4M plays`;
        zero and null (unavailable) show no label. Counts are computed per request and never cached by the gateway or
        CDN; the app shows the value it was last given and does not poll.
