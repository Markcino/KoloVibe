  parameters:
    P2Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Actor/operation/resource scoped. Persist key+request hash+effect+answer atomically; mismatched
        reuse 409.
    P2StepUp:
      name: X-Step-Up-Proof
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      description: 'Decision G: purpose/resource/audience/session-bound single-use proof. Missing, expired or replayed
        proof fails closed.'
x-contract-status: REVIEW REQUIRED
x-governance:
  issues:
  - 305
  - 140
  - 141
  versioning: Additive changes within v1; breaking path/body/authorization/event semantic changes require reviewed
    ADR, new major version, migration and explicit consumer compatibility period. No silent aliases.
  idempotency: Actor+operation+resource+Idempotency-Key scope, hash canonical request; same key/different body 409;
    reserve record and effect atomically; retry returns stored status/body. Retention is approved policy, never
    shorter than outstanding financial workflow.
  financial-integrity: Finance-only providers and ledger; sandbox only; signed raw callback plus server retrieve;
    inbox+journal+outbox transaction. Events/Advertising keep operational facts only. Points snapshot is allocation
    weight, never redemption.
  privacy: Allowlist request fields; object authorization before response; no-store private financial, token, credential
    and notification responses; bounded errors without input/personal data. Logs omit bodies/tokens.
  planned-activation: Design approval is not deployment approval. Capability flags closed by default, grant and
    step-up checks remain fail-closed.
