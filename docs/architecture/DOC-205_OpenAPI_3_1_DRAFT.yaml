          description: Identity, SMTP or MFA unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeratorInvitationSetup'
      description: Mailbox-bound 256-bit-or-stronger invitation proof required. No account or session exists yet.
        The private setup key and password hash are kept encrypted/hashed by Identity; the web keeps invitation
        proof and setup key encrypted in a server session. Five-minute setup lifetime; no invitation codes in URLs.
        The inviter must remain an active MFA-enrolled administrator. Five failed password/TOTP attempts exhaust
        the invitation.
      x-service-owner: identity
  /internal/auth/moderator-invitations/complete:
    post:
      tags:
      - Identity
      summary: Activate only a moderator after current-period TOTP enrollment
      operationId: post_internal_auth_moderator_invitations_complete
      x-implementation: local
      security:
      - internalCaller: []
        internalTimestamp: []
        internalNonce: []
        internalSignature: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModeratorInvitationCompleteResult'
        '400':
          description: Invalid input
        '401':
          description: Invalid, expired or consumed invitation/session
        '403':
          description: Administrator role, fresh MFA or activation required
        '409':
          description: Existing account, pending invitation or idempotency conflict
        '429':
          description: Bounded invitation or enrollment attempt limit
        '503':
          description: Identity, SMTP or MFA unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeratorInvitationComplete'
      description: Consumes the invitation atomically, creates an email-verified moderator with encrypted TOTP and
        hashed one-use recovery codes, and records enrollment and acceptance audit events. Only the current server-aligned
        30-second TOTP period is accepted; its step is consumed. This creates no login session and grants no queue
        assignments. Expiry, revocation, replay, wrong mailbox and inactive/non-administrator inviter fail closed.
        Recovery codes are returned once only.
      x-service-owner: identity
