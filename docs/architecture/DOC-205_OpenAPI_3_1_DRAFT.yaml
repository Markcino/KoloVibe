          - documentaries
        tags:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 64
          description: 'Trim each input tag, remove one optional leading #, lowercase and deduplicate. Each normalized
            value must match ^[a-z0-9_]{1,30}$.'
        cover_time_ms:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 300000
          description: Must not exceed known duration_ms. Unknown draft duration is checked during processing.
    UploadIntent:
      type: object
      additionalProperties: false
      required: [upload_id, video_id, upload_url, upload_headers, expires_at, max_bytes]
