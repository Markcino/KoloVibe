  /internal/security-events:
    servers:
    - url: https://audit.internal.invalid
      description: Private service origin placeholder; never exposed through the public gateway
    post:
      tags:
      - Internal Events
      operationId: ingestAuditEvent
      summary: Idempotently retain immutable producer audit evidence
      x-implementation: local
      x-internal-only: true
      x-authentication: Per-producer HMAC SHA-256, audience/method/path/body binding, 60-second timestamp and single-use
        nonce
      description: Accepts identity, moderation, creators, content and points, constrained by per-producer kind
        allow-lists. Distinct caller keys are required. ID replay with identical payload from the same producer
        is 200; producer/payload collision is 409. Unknown caller is 403; invalid kind/subject/shape is 400. Moderation
        decisions, reports and appeals atomically create immutable producer events plus AuditDelivery rows; deliver_audit_events
        uses two-second requests, bounded batches (1..1000), capped one-hour exponential retry delay, and retains
        failed deliveries indefinitely. Points atomically creates points.awarded and points.withheld events (null
        actor, subject_type points_entry, subject_id the qualification event id) with AuditDelivery rows and delivers
        them with its own deliver_audit_events. Creators and content are accepted by ingest; this change does not
        add their producers/outboxes.
      security:
      - internalCaller: []
        internalTimestamp: []
        internalNonce: []
        internalSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditInternalEvent'
      responses:
        '201':
          description: Event stored
        '200':
          description: Identical producer event replay acknowledged
        '400':
          description: Invalid event or kind/subject not allowed
        '403':
          description: Unapproved or invalid producer signature
        '409':
          description: ID collision with different content or producer
      x-service-owner: audit
