        or

        cursor): any other combination is 400. Content supplies the creator''s publicly eligible videos

        (published, public, moderation-approved, not deleted); Engagement supplies `play_count`. Order is `play_count`

        descending, ties broken by Content''s newest-first order (created_at, then id), so repeated requests return
        the

        same order. At most 20 items, `next_cursor` null. It is **not** global trending relabelled: it ranks one
        creator''s

