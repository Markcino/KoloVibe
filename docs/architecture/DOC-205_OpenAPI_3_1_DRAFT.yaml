      type: object
      additionalProperties: false
      properties:
        creator_id:
          type: string
          format: uuid
        balance:
          type: integer
        currency:
          type: string
          enum:
          - POINTS
        as_of:
          type: string
          format: date-time
        confirmed:
          type: integer
          minimum: 0
          description: Gross positive AWARD deltas already posted in the append-only ledger. A later reversal is
            reported separately; no artificial confirmation delay.
        pending:
          type: integer
          minimum: 0
          description: One point per validated qualification received by Points whose durable receipt is still pending
            posting. Does not estimate broker backlog or events not received by Points.
        withheld:
          type: integer
          minimum: 0
          description: One point per retained receipt whose award was blocked by the DEC-003 UTC daily cap. No ledger
            mutation or award is fabricated. This flow has no restriction-withholding input, so this metric does
            not invent restriction blocks.
        reversed:
          type: integer
          minimum: 0
          description: Absolute sum of negative REVERSAL ledger deltas. ADJUSTMENT deltas affect balance but not
            these four category totals.
      required:
      - creator_id
      - balance
      - currency
      - as_of
      - confirmed
      - pending
      - withheld
      - reversed
      description: Non-cash points only. balance is the signed sum of every ledger delta, including reversals and
        adjustments; pending/withheld are not in balance. Categories are backed by retained records. Legacy discarded
        cap events cannot be reconstructed and are not estimated.
