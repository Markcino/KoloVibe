name: Stage 3 one-time dependency lock refresh
on:
  push:
    branches: [feature/stage3-secure-foundations]
    paths:
      - requirements-dev.in
      - .github/workflows/stage3-lock-refresh.yml
permissions:
  contents: write
concurrency:
  group: stage3-lock-refresh
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'Markcino/KoloVibe' && github.ref == 'refs/heads/feature/stage3-secure-foundations'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate reviewed hashed runtime lock
        run: |
          python -m pip install "uv==0.9.15"
          uv pip compile --generate-hashes --python-version 3.12 --output-file requirements-dev.txt requirements-dev.in
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check
      - name: Commit only lockfile changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate locked Celery and psycopg dependencies"
            git push origin HEAD:feature/stage3-secure-foundations
          fi
