name: ci_cd
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: Checks to run (manual runs never publish images)
        type: choice
        required: true
        default: ci
        options: [ci, dependency-locks, staging-security]
permissions:
  contents: read
jobs:
  validate-dispatch:
    name: Validate manual operation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check allowed maintenance branch
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            ci) ;;
            dependency-locks)
              test "$GITHUB_REF" = refs/heads/security/ci-hardening || {
                echo "::error::Dependency lock generation requires security/ci-hardening"; exit 1;
              } ;;
            staging-security)
              test "$GITHUB_REF" = refs/heads/main || {
                echo "::error::Staging verification requires reviewed main"; exit 1;
              } ;;
            *) echo "::error::Unknown operation"; exit 1 ;;
          esac
  python:
    name: Django services and reproducibility
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check committed lockfiles
        run: |
          python scripts/verify_dependency_locks.py --python --flutter
          python scripts/verify_dependency_locks.py --ci
      - name: Enforce hashed lockfile
        run: |
          python scripts/verify_dependency_locks.py --python
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip check
      - name: TLS PostgreSQL migrations, isolation, ledger and event integration
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/test_postgres_foundations.py
      - name: Isolated gateway, mail and web contract journeys
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/verify_local_journeys.py
      - name: Restricted staging WSGI, TLS and capability journeys
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          PYTHONPATH=scripts python -m verify_staging_runtime
      - name: Service checks
        run: |
          python scripts/check_structure.py
          python scripts/check_mobile_design.py
          python -m unittest discover -s scripts -p 'test_*.py'
          export KOLOVIBE_ENV=local
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          for service in gateway identity creators content engagement points moderation audit; do
            (cd "services/$service" && python manage.py makemigrations --check --dry-run && python manage.py test tests --verbosity 1)
          done
          export KOLOVIBE_GATEWAY_URL=http://127.0.0.1:8000
          (cd apps/web_django && python manage.py check && python manage.py test tests --verbosity 1)
      - name: Validate OpenAPI
        run: |
          python - <<'PY'
          from openapi_spec_validator import validate
          import yaml
          from pathlib import Path
          for p in [Path("packages/contracts/openapi/health.yaml"), Path("docs/architecture/DOC-205_OpenAPI_3_1_DRAFT.yaml")]:
              with p.open() as f:
                  spec = yaml.safe_load(f)
              validate(spec)
              print("Validated", p)
          PY
  security:
    name: Security scans and SBOM
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify CI toolchain lock
        run: python scripts/verify_dependency_locks.py --ci
      - name: Install locked application dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install auditing tools
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Dependency vulnerability audit
        run: |
          mkdir -p security-reports
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --format json --output security-reports/python-vulnerabilities.json
      - name: Python static security review
        run: |
          bandit -r services scripts apps/web_django -f json -o security-reports/bandit.json || true
          python scripts/enforce_bandit.py security-reports/bandit.json
      - name: Secret discovery and regression checks
        run: |
          PYTHONPATH=scripts python -m unittest -v scripts/test_check_secret_findings.py
          detect-secrets scan --all-files --exclude-files '(^\.git/)' > security-reports/secret-findings.json
          python scripts/check_secret_findings.py security-reports/secret-findings.json
      - name: Software bill of materials
        if: always()
        run: |
          mkdir -p security-reports
          cyclonedx-py requirements requirements-dev.txt --output-format JSON --output-file security-reports/python-sbom.json
          python -m json.tool security-reports/python-sbom.json >/dev/null
      - name: Publish security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-reports
          path: security-reports/
          if-no-files-found: warn
  flutter:
    name: Flutter static and widget tests
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Ensure Flutter lockfile present
        run: python scripts/verify_dependency_locks.py --flutter
      - name: Resolve exactly locked packages
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
      - name: Check generated package drift
        run: git diff --exit-code -- apps/mobile/pubspec.lock
  osv:
    name: Python and Flutter dependency advisories
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'ci'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --lockfile=requirements.txt:requirements-dev.txt
        --lockfile=apps/mobile/pubspec.lock
    permissions:
      contents: read
      actions: read
      security-events: write
  image-build:
    name: Build and scan shared service image
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build shared service image
        run: |
          docker build --pull \
            --file infra/docker/Dockerfile.service \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "kolovibe/services:ci" .
      - name: Inspect image configuration
        run: |
          set -euo pipefail
          test "$(docker image inspect "kolovibe/services:ci" --format '{{.Config.User}}')" = '10001:10001'
          docker image inspect "kolovibe/services:ci" --format '{{.Config.WorkingDir}}' | grep -qx /app
          test -z "$(docker image inspect "kolovibe/services:ci" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Ei '(SECRET|TOKEN|PASSWORD|PRIVATE_KEY)=' || true)"
          for service in unset invalid '../identity'; do
            if docker run --rm -e "KOLOVIBE_SERVICE_NAME=$service" "kolovibe/services:ci"; then
              echo "::error::Shared image accepted invalid service selection"; exit 1
            fi
          done
      - name: Scan local image vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: kolovibe/services:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Generate verified image SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: kolovibe/services:ci
          format: cyclonedx-json
          output-file: image-sbom.json
          upload-artifact: false
          upload-release-assets: false
      - name: Preserve the verified image
        run: |
          set -euo pipefail
          mkdir -p verified-image
          docker save "kolovibe/services:ci" --output verified-image/image.tar
          docker image inspect "kolovibe/services:ci" \
            --format '{{.Id}}' > verified-image/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > verified-image/revision.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.verify_image_artifact import SERVICES
          Path("verified-image/services.json").write_text(json.dumps(list(SERVICES)))
          PY
          cp image-sbom.json verified-image/image-sbom.json
          (cd verified-image && sha256sum image.tar > image.tar.sha256)
      - name: Upload the verified image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-image-${{ github.sha }}
          path: verified-image/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  build-and-verify:
    name: Image build and security / ${{ matrix.service }}
    needs: [image-build]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, creators, content, engagement, points, moderation, audit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-image-${{ github.sha }}
          path: verified-image
      - name: Load the shared image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_image_artifact.py verified-image --revision "$REVISION"
          docker load --input verified-image/image.tar
          test "$(docker image inspect kolovibe/services:ci --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          test "$(docker image inspect kolovibe/services:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
      - name: Run service HTTP smoke check
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          SECRET="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$SECRET"
          docker run -d --name "kolovibe-$SERVICE" \
            -p 127.0.0.1:18080:8000 \
            -e "KOLOVIBE_SERVICE_NAME=$SERVICE" \
            -e KOLOVIBE_ENV=local \
            -e DJANGO_SECRET_KEY="$SECRET" \
            "kolovibe/services:ci"
          trap 'docker logs "kolovibe-$SERVICE" || true; docker rm -f "kolovibe-$SERVICE" || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:18080/health/live > /tmp/kolovibe-health.json; then
              break
            fi
            sleep 1
          done
          if ! docker ps --filter "name=kolovibe-$SERVICE" --filter "status=running" --quiet | grep -q .; then
            echo "::error::Container exited unexpectedly"; docker logs "kolovibe-$SERVICE"; exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path("/tmp/kolovibe-health.json").read_text()) != {"status": "ok"}:
              raise SystemExit("Unexpected liveness response")
          PY
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:18080/health/live)"
          test "$code" = "405"
      - name: Check for unapproved deploy configuration
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          for environment in unset production staging; do
            if docker run --rm -e "KOLOVIBE_SERVICE_NAME=$SERVICE" -e "KOLOVIBE_ENV=$environment" \
              "kolovibe/services:ci" --check-settings; then
              echo "::error::Service accepted an unauthorized or incomplete deployment profile"
              exit 1
            fi
          done
  publish:
    name: Publish verified shared image
    needs: [python, security, flutter, osv, image-build, build-and-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: ghcr-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the verified image from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-image-${{ github.sha }}
          path: verified-image
      - name: Verify and load the exact tested image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_image_artifact.py verified-image --revision "$REVISION"
          docker load --input verified-image/image.tar
          IMAGE="kolovibe/services:ci"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
      - name: Authenticate and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_ID="$(cat verified-image/image-id.txt)"
          TARGET="ghcr.io/$REPOSITORY/services:$REVISION-${IMAGE_ID#sha256:}"
          docker tag "kolovibe/services:ci" "$TARGET"
          docker push "$TARGET"
          docker pull "$TARGET"
          test "$(docker image inspect "$TARGET" --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          DIGEST="$(docker image inspect "$TARGET" --format '{{index .RepoDigests 0}}')"
          printf '%s\n' "$DIGEST" | grep -Eq "^ghcr.io/$REPOSITORY/services@sha256:[0-9a-f]{64}$"
          printf '%s\n' "$DIGEST" > verified-image/published-digest.txt
          printf '%s\n' "$TARGET" > verified-image/published-tag.txt
          printf '### Shared services image\n\nCommit: `%s`\n\nImage: `%s`\n' "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-${{ github.sha }}
          path: |
            verified-image/published-digest.txt
            verified-image/published-tag.txt
            verified-image/image-id.txt
            verified-image/revision.txt
            verified-image/services.json
            verified-image/image-sbom.json
          if-no-files-found: error
  generate:
    name: Generate dependency locks
    if: >-
      github.ref == 'refs/heads/security/ci-hardening' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'dependency-locks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate hashed Python lock
        run: |
          python -m pip install "uv==0.9.15"
          uv pip compile --generate-hashes --python-version 3.12 --output-file requirements-ci.txt requirements-ci.in
          uv pip compile --generate-hashes --python-version 3.12 --constraint requirements-ci.txt --output-file requirements-dev.txt requirements-dev.in
      - name: Generate Flutter lock
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check locked Python installation
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip check
      - name: Commit lockfiles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.txt requirements-ci.txt apps/mobile/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: generate reproducible Python and Flutter dependency locks"
            git push origin HEAD:security/ci-hardening
          fi
      - name: Upload resolved locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-locks
          path: |
            requirements-dev.txt
            requirements-ci.txt
            apps/mobile/pubspec.lock
          if-no-files-found: error
  verify:
    name: Environment security review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'staging-security' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging-security-review
    permissions:
      contents: read
    concurrency:
      group: kolovibe-environment-security-review
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate approved environment configuration and credentials
        env:
          KOLOVIBE_STAGING_URL: ${{ vars.KOLOVIBE_STAGING_URL }}
          KOLOVIBE_STAGING_HOST: ${{ vars.KOLOVIBE_STAGING_HOST }}
          KOLOVIBE_STAGING_CHECK_PATH: ${{ vars.KOLOVIBE_STAGING_CHECK_PATH }}
          KOLOVIBE_STAGING_CHECK_TOKEN: ${{ secrets.KOLOVIBE_STAGING_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KOLOVIBE_STAGING_URL" || { echo "::error::Missing staging URL environment variable"; exit 1; }
          test -n "$KOLOVIBE_STAGING_HOST" || { echo "::error::Missing staging host environment variable"; exit 1; }
          test -n "$KOLOVIBE_STAGING_CHECK_PATH" || { echo "::error::Missing authenticated probe path environment variable"; exit 1; }
          test -n "$KOLOVIBE_STAGING_CHECK_TOKEN" || { echo "::error::Missing environment-scoped probe token"; exit 1; }
          python scripts/verify_staging.py
