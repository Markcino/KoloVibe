name: ci_cd
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '13 5 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: Checks to run (manual runs never publish images)
        type: choice
        required: true
        default: ci
        options: [ci, dependency-locks, staging-security, identity-secrets]
permissions:
  contents: read
jobs:
  validate-dispatch:
    name: Validate manual operation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check allowed maintenance branch
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            ci) ;;
            dependency-locks)
              test "$GITHUB_REF" = refs/heads/security/ci-hardening || {
                echo "::error::Dependency lock generation requires security/ci-hardening"; exit 1;
              } ;;
            staging-security|identity-secrets)
              test "$GITHUB_REF" = refs/heads/main || {
                echo "::error::Staging verification requires reviewed main"; exit 1;
              } ;;
            *) echo "::error::Unknown operation"; exit 1 ;;
          esac
  python:
    name: Django services and reproducibility
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check committed lockfiles
        run: |
          python scripts/verify_dependency_locks.py --python --flutter
          python scripts/verify_dependency_locks.py --ci
      - name: Enforce hashed lockfile
        run: |
          python scripts/verify_dependency_locks.py --python
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip check
      - name: TLS PostgreSQL migrations, isolation, ledger and event integration
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/test_postgres_foundations.py
      - name: Isolated gateway, mail and web contract journeys
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/verify_local_journeys.py
      - name: Restricted staging WSGI, TLS and capability journeys
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          PYTHONPATH=scripts python -m verify_staging_runtime
      - name: Read-only R1 database preflight (disposable PostgreSQL)
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/verify_r1_db_preflight.py
      - name: Service checks
        run: |
          python scripts/check_structure.py
          python scripts/check_mobile_design.py
          python -m unittest discover -s scripts -p 'test_*.py'
          export KOLOVIBE_ENV=local
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          for service in gateway identity creators content engagement points moderation audit; do
            (cd "services/$service" && python manage.py makemigrations --check --dry-run && python manage.py test tests --verbosity 1)
          done
          export KOLOVIBE_GATEWAY_URL=http://127.0.0.1:8000
          (cd apps/web_django && python manage.py check && python manage.py test tests --verbosity 1)
      - name: Validate OpenAPI
        run: |
          python - <<'PY'
          from openapi_spec_validator import validate
          import yaml
          from pathlib import Path
          for p in [Path("packages/contracts/openapi/health.yaml"), Path("docs/architecture/DOC-205_OpenAPI_3_1_DRAFT.yaml")]:
              with p.open() as f:
                  spec = yaml.safe_load(f)
              validate(spec)
              print("Validated", p)
          PY
  security:
    name: Security scans and SBOM
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify CI toolchain lock
        run: python scripts/verify_dependency_locks.py --ci
      - name: Install locked application dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install auditing tools
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Secret discovery and regression checks
        run: |
          PYTHONPATH=scripts python -m unittest -v scripts/test_check_secret_findings.py
          detect-secrets scan --all-files --exclude-files '(^\.git/)' > "$RUNNER_TEMP/secret-findings.json"
          mkdir -p security-reports
          mv "$RUNNER_TEMP/secret-findings.json" security-reports/secret-findings.json
          python scripts/check_secret_findings.py security-reports/secret-findings.json
      - name: Dependency vulnerability audit
        run: |
          mkdir -p security-reports
          pip-audit -r requirements-dev.txt --no-deps --disable-pip --format json --output security-reports/python-vulnerabilities.json
          pip-audit -r requirements-ci.txt --no-deps --disable-pip --format json --output security-reports/ci-toolchain-vulnerabilities.json
      - name: Python static security review
        run: |
          bandit -r services scripts apps/web_django -f json -o security-reports/bandit.json || true
          python scripts/enforce_bandit.py security-reports/bandit.json
      - name: Software bill of materials
        if: always()
        run: |
          mkdir -p security-reports
          cyclonedx-py requirements requirements-dev.txt --output-format JSON --output-file security-reports/python-sbom.json
          python -m json.tool security-reports/python-sbom.json >/dev/null
  flutter:
    name: Flutter static and widget tests
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Ensure Flutter lockfile present
        run: python scripts/verify_dependency_locks.py --flutter
      - name: Resolve exactly locked packages
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test
        working-directory: apps/mobile
        run: |
          flutter analyze
          flutter test
      - name: Check generated package drift
        run: git diff --exit-code -- apps/mobile/pubspec.lock
  osv:
    name: Python and Flutter dependency advisories / osv-scan
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The upstream reusable workflow always uploads SARIF to Actions artifacts,
      # even when its code-scanning upload is disabled. Direct scanning retains
      # the nonzero vulnerability exit without consuming artifact quota.
      - name: Scan locked Python and Flutter dependencies
        uses: google/osv-scanner-action/osv-scanner-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        with:
          scan-args: |-
            --lockfile=requirements.txt:requirements-dev.txt
            --lockfile=apps/mobile/pubspec.lock
  image-build:
    name: Build and scan shared service image
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build shared service image
        run: |
          docker build --pull \
            --target release \
            --file infra/docker/Dockerfile.service \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "kolovibe/services:ci" .
      - name: Inspect image configuration
        run: |
          set -euo pipefail
          test "$(docker image inspect "kolovibe/services:ci" --format '{{.Config.User}}')" = '10001:10001'
          docker image inspect "kolovibe/services:ci" --format '{{.Config.WorkingDir}}' | grep -qx /app
          test -z "$(docker image inspect "kolovibe/services:ci" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Ei '(SECRET|TOKEN|PASSWORD|PRIVATE_KEY)=' || true)"
          for service in unset invalid '../identity'; do
            if docker run --rm -e "KOLOVIBE_SERVICE_NAME=$service" "kolovibe/services:ci"; then
              echo "::error::Shared image accepted invalid service selection"; exit 1
            fi
          done
      - name: Verify the shared image carries no FFmpeg
        run: |
          set -euo pipefail
          for tool in ffmpeg ffprobe; do
            if docker run --rm --entrypoint sh "kolovibe/services:ci" -c "command -v $tool"; then
              echo "::error::$tool must exist only in the media-worker image"; exit 1
            fi
          done
      - name: Verify the release image has no SQLite
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint python "kolovibe/services:ci" -c 'import sqlite3'; then
            echo "::error::Release image still provides the sqlite3 module"; exit 1
          fi
          if docker run --rm --entrypoint apk "kolovibe/services:ci" list -I | grep -i sqlite; then
            echo "::error::Release image still installs an SQLite package"; exit 1
          fi
      - name: Scan local image vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: kolovibe/services:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Generate verified image SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: kolovibe/services:ci
          format: cyclonedx-json
          output-file: image-sbom.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify the image SBOM lists no SQLite component
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          components = json.loads(Path("image-sbom.json").read_text())["components"]
          found = sorted(c.get("name", "") for c in components if "sqlite" in c.get("name", "").lower())
          if not components or found:
              raise SystemExit(f"Image SBOM is empty or lists SQLite components: {found}")
          print(f"Image SBOM: {len(components)} components, none SQLite")
          PY
      - name: Preserve Python dependency SBOM
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt
          cyclonedx-py requirements requirements-dev.txt --output-format JSON --output-file python-sbom.json
          python -m json.tool python-sbom.json >/dev/null
      - name: Verify the R2 proxy implementation is inside the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "kolovibe/services:ci" -c "
          from pathlib import Path
          src = Path('/app/services/content/service/media_storage.py').read_text()
          missing = [n for n in ('_proxy_endpoint', '_connection', 'set_tunnel', 'KOLOVIBE_R2_HTTPS_PROXY') if n not in src]
          if missing or 'HTTPSConnection(target.hostname' in src:
              raise SystemExit('R2 proxy implementation missing from image: %s' % missing)
          "
      - name: Preserve the verified image
        run: |
          set -euo pipefail
          mkdir -p verified-image
          docker save "kolovibe/services:ci" --output verified-image/image.tar
          docker image inspect "kolovibe/services:ci" \
            --format '{{.Id}}' > verified-image/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > verified-image/revision.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.verify_image_artifact import SERVICES
          Path("verified-image/services.json").write_text(json.dumps(list(SERVICES)))
          PY
          cp image-sbom.json verified-image/image-sbom.json
          cp python-sbom.json verified-image/python-sbom.json
          (cd verified-image && sha256sum image.tar > image.tar.sha256)
      - name: Upload the verified image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-image-${{ github.sha }}
          path: verified-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  media-image-build:
    name: Build and scan media worker image
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    env:
      # The supported Alpine 3.24 Python 3.12.16 base, by digest. It must equal the Dockerfile's default PYTHON_BASE
      # (the shared image uses the same base; scripts/test_shared_service_image.py enforces this).
      MEDIA_PYTHON_BASE: python:3.12.16-alpine3.24@sha256:c5ba3deef00c7758561a0f03c26f44f10589263d40e732b8748e0d1f38f6dd89
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build media worker image
        run: |
          docker build --pull \
            --target release \
            --build-arg "PYTHON_BASE=$MEDIA_PYTHON_BASE" \
            --build-arg WITH_FFMPEG=1 \
            --build-arg FFMPEG_SOURCE=ffmpeg-minimal \
            --file infra/docker/Dockerfile.service \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.title=kolovibe-media-worker" \
            --tag "kolovibe/media-worker:ci" .
      - name: Inspect media image configuration
        run: |
          set -euo pipefail
          test "$(docker image inspect "kolovibe/media-worker:ci" --format '{{.Config.User}}')" = '10001:10001'
          docker image inspect "kolovibe/media-worker:ci" --format '{{.Config.WorkingDir}}' | grep -qx /app
          test -z "$(docker image inspect "kolovibe/media-worker:ci" --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -Ei '(SECRET|TOKEN|PASSWORD|PRIVATE_KEY)=' || true)"
          docker run --rm --entrypoint cat "kolovibe/media-worker:ci" /etc/alpine-release | grep -q '^3\.24\.'
          for service in unset invalid '../identity'; do
            if docker run --rm -e "KOLOVIBE_SERVICE_NAME=$service" "kolovibe/media-worker:ci"; then
              echo "::error::Media image accepted invalid service selection"; exit 1
            fi
          done
      - name: Verify the R2 proxy implementation is inside the image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "kolovibe/media-worker:ci" -c "
          from pathlib import Path
          src = Path('/app/services/content/service/media_storage.py').read_text()
          missing = [n for n in ('_proxy_endpoint', '_connection', 'set_tunnel', 'KOLOVIBE_R2_HTTPS_PROXY') if n not in src]
          if missing or 'HTTPSConnection(target.hostname' in src:
              raise SystemExit('R2 proxy implementation missing from image: %s' % missing)
          "
      - name: Verify FFmpeg for the media worker on the sandbox PATH
        run: |
          set -euo pipefail
          for tool in ffmpeg ffprobe; do
            docker run --rm --entrypoint python "kolovibe/media-worker:ci" -c \
              "import os, shutil, sys; sys.exit(0 if shutil.which('$tool', path=os.defpath) else 1)" || {
              echo "::error::$tool is not on the encoder's fixed PATH"; exit 1;
            }
            docker run --rm --entrypoint "$tool" "kolovibe/media-worker:ci" -version >/dev/null
          done
      - name: Verify FFmpeg is the minimal build the pipeline needs and nothing more
        run: |
          set -euo pipefail
          # Each listing is captured whole before it is checked: a reader that exits early (head, grep -q) would
          # close the pipe and fail `docker run` with a broken pipe under pipefail.
          run() { docker run --rm --entrypoint "$1" "kolovibe/media-worker:ci" "${@:2}" 2>&1; }
          version="$(run ffmpeg -hide_banner -version)"
          case "${version%%$'\n'*}" in
            "ffmpeg version 9.0.2"*) ;;
            *) echo "::error::Unexpected FFmpeg version line: ${version%%$'\n'*}"; exit 1 ;;
          esac
          protocols="$(run ffmpeg -hide_banner -protocols | grep -vE '^(Supported|Input|Output)' | tr -s ' \n' ' ')"
          test "$(printf '%s' "$protocols" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')" = "file pipe " || {
            echo "::error::FFmpeg must support only the file and pipe protocols, got: $protocols"; exit 1; }
          encoders="$(run ffmpeg -hide_banner -encoders)"
          for encoder in libx264 aac mjpeg; do
            grep -qE " $encoder " <<<"$encoders" || { echo "::error::FFmpeg lacks the $encoder encoder"; exit 1; }
          done
          for listing in -encoders -decoders -demuxers -muxers -protocols; do
            output="$(run ffmpeg -hide_banner "$listing")"
            for absent in libvpx libopus libx265 rtsp rtp http tcp udp tls; do
              if grep -qiE "(^| )$absent( |$)" <<<"$output"; then
                echo "::error::FFmpeg $listing must not include $absent"; exit 1; fi
            done
          done
          run ffprobe -hide_banner -version >/dev/null
          # No device library, no network or audio-device libraries in the image's dependency closure.
          installed="$(docker run --rm --entrypoint apk "kolovibe/media-worker:ci" list -I)"
          if grep -E '^(cjson|alsa-lib|glib|libssh|libzmq|libpulse|libsrt|dbus-libs)-' <<<"$installed"; then
            echo "::error::The media image carries a library FFmpeg does not need"; exit 1
          fi
      - name: End-to-end media pipeline test inside the image
        run: |
          set -euo pipefail
          # The release image has no SQLite, so the settings use the PostgreSQL profile with placeholder files (no
          # connection is ever opened: the tests use no database) and the repository's real encode and poster tests
          # run under unittest rather than the Django test runner. The real-encode test must pass, not skip.
          docker run --rm -e KOLOVIBE_ENV=local -e DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')" \
            -e DJANGO_SETTINGS_MODULE=service.settings -e KOLOVIBE_DB_NAME=placeholder -e KOLOVIBE_DB_USER=placeholder \
            -e KOLOVIBE_DB_HOST=placeholder.invalid -e KOLOVIBE_DB_PASSWORD_FILE=/tmp/placeholder -e KOLOVIBE_DB_SSLROOTCERT=/tmp/placeholder \
            --workdir /app/services/content --entrypoint sh "kolovibe/media-worker:ci" -c 'printf placeholder > /tmp/placeholder && python -c "
          import sys, unittest
          sys.path.insert(0, \".\")
          import django
          django.setup()
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromName(\"tests.test_posters\"))
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)"' 2>&1 | tee media-e2e.log
          grep -q 'test_real_bounded_encoding_and_jpeg_render_for_short_and_longer_clips.* ok' media-e2e.log
      - name: Verify the media image has no SQLite
        run: |
          set -euo pipefail
          if docker run --rm --entrypoint python "kolovibe/media-worker:ci" -c 'import sqlite3'; then
            echo "::error::Media image still provides the sqlite3 module"; exit 1
          fi
          if docker run --rm --entrypoint apk "kolovibe/media-worker:ci" list -I | grep -i sqlite; then
            echo "::error::Media image still installs an SQLite package"; exit 1
          fi
      - name: Scan media image vulnerabilities
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: kolovibe/media-worker:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
      - name: Generate verified media image SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: kolovibe/media-worker:ci
          format: cyclonedx-json
          output-file: media-image-sbom.json
          upload-artifact: false
          upload-release-assets: false
      - name: Verify the media image SBOM lists FFmpeg and no SQLite component
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          components = json.loads(Path("media-image-sbom.json").read_text())["components"]
          names = sorted(c.get("name", "").lower() for c in components)
          if not components or any("sqlite" in n for n in names) or "ffmpeg" not in names:
              raise SystemExit("Media SBOM is empty, lists SQLite, or does not list ffmpeg")
          print(f"Media image SBOM: {len(components)} components, ffmpeg present, none SQLite")
          PY
      - name: Preserve Python dependency SBOM
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements-ci.txt
          cyclonedx-py requirements requirements-dev.txt --output-format JSON --output-file python-sbom.json
          python -m json.tool python-sbom.json >/dev/null
      - name: Preserve the verified media image
        run: |
          set -euo pipefail
          mkdir -p verified-media-image
          docker save "kolovibe/media-worker:ci" --output verified-media-image/image.tar
          docker image inspect "kolovibe/media-worker:ci" --format '{{.Id}}' > verified-media-image/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > verified-media-image/revision.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.verify_image_artifact import SERVICES
          Path("verified-media-image/services.json").write_text(json.dumps(list(SERVICES)))
          PY
          cp media-image-sbom.json verified-media-image/image-sbom.json
          cp python-sbom.json verified-media-image/python-sbom.json
          (cd verified-media-image && sha256sum image.tar > image.tar.sha256)
      - name: Upload the verified media image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-media-image-${{ github.sha }}
          path: verified-media-image/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  build-and-verify:
    name: Image build and security / ${{ matrix.service }}
    needs: [image-build]
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'ci')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, creators, content, engagement, points, moderation, audit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-image-${{ github.sha }}
          path: verified-image
      - name: Load the shared image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_image_artifact.py verified-image --revision "$REVISION"
          docker load --input verified-image/image.tar
          test "$(docker image inspect kolovibe/services:ci --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          test "$(docker image inspect kolovibe/services:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked fixture dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Run service PostgreSQL smoke check
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          export PATH="$(pg_config --bindir):$PATH"
          python scripts/smoke_release_image.py --image "kolovibe/services:ci" --service "$SERVICE"
      - name: Check for unapproved deploy configuration
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          for environment in unset production staging; do
            if docker run --rm -e "KOLOVIBE_SERVICE_NAME=$SERVICE" -e "KOLOVIBE_ENV=$environment" \
              "kolovibe/services:ci" --check-settings; then
              echo "::error::Service accepted an unauthorized or incomplete deployment profile"
              exit 1
            fi
          done
  publish:
    name: Publish verified shared and media worker images
    needs: [python, security, flutter, osv, image-build, media-image-build, build-and-verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: ghcr-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the verified image from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-image-${{ github.sha }}
          path: verified-image
      - name: Download the verified media image from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-media-image-${{ github.sha }}
          path: verified-media-image
      - name: Verify and load the exact tested image
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_image_artifact.py verified-image --revision "$REVISION"
          docker load --input verified-image/image.tar
          IMAGE="kolovibe/services:ci"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
      - name: Authenticate and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          TARGET="ghcr.io/$REPOSITORY/services:v0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          docker tag "kolovibe/services:ci" "$TARGET"
          docker push "$TARGET"
          DIGEST="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest}}' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          printf '%s\n' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::Published image has an invalid digest"; exit 1;
          }
          DIGEST="ghcr.io/$REPOSITORY/services@$DIGEST"
          docker pull "$DIGEST"
          test "$(docker image inspect "$DIGEST" --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          printf '%s\n' "$DIGEST" > verified-image/published-digest.txt
          printf '%s\n' "$TARGET" > verified-image/published-tag.txt
          python3 -c 'import json, pathlib, sys; pathlib.Path("verified-image/publication.json").write_text(json.dumps(dict(zip(("tag", "digest", "revision", "image_id"), sys.argv[1:]))) + "\n")' \
            "$TARGET" "$DIGEST" "$REVISION" "$(cat verified-image/image-id.txt)"
          printf '### Shared services image\n\nCommit: `%s`\n\nTag: `%s`\n\nImage: `%s`\n' "$REVISION" "$TARGET" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Authenticate and publish media worker image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_image_artifact.py verified-media-image --revision "$REVISION"
          docker load --input verified-media-image/image.tar
          test "$(docker image inspect "kolovibe/media-worker:ci" --format '{{.Id}}')" = "$(cat verified-media-image/image-id.txt)"
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          MEDIA_REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          MEDIA_TARGET="ghcr.io/$MEDIA_REPOSITORY/media-worker:v0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          docker tag "kolovibe/media-worker:ci" "$MEDIA_TARGET"
          docker push "$MEDIA_TARGET"
          MEDIA_DIGEST="$(docker buildx imagetools inspect "$MEDIA_TARGET" --format '{{json .Manifest}}' |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          printf '%s\n' "$MEDIA_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || {
            echo "::error::Published media image has an invalid digest"; exit 1;
          }
          MEDIA_DIGEST="ghcr.io/$MEDIA_REPOSITORY/media-worker@$MEDIA_DIGEST"
          docker pull "$MEDIA_DIGEST"
          test "$(docker image inspect "$MEDIA_DIGEST" --format '{{.Id}}')" = "$(cat verified-media-image/image-id.txt)"
          printf '%s\n' "$MEDIA_DIGEST" > verified-image/published-media-digest.txt
          printf '%s\n' "$MEDIA_TARGET" > verified-image/published-media-tag.txt
          cp verified-media-image/image-id.txt verified-image/media-image-id.txt
          cp verified-media-image/image-sbom.json verified-image/media-image-sbom.json
          printf '### Media worker image\n\nCommit: `%s`\n\nTag: `%s`\n\nImage: `%s`\n' "$REVISION" "$MEDIA_TARGET" "$MEDIA_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-${{ github.sha }}
          path: |
            verified-image/published-digest.txt
            verified-image/published-tag.txt
            verified-image/publication.json
            verified-image/image-id.txt
            verified-image/revision.txt
            verified-image/services.json
            verified-image/image-sbom.json
            verified-image/python-sbom.json
            verified-image/published-media-digest.txt
            verified-image/published-media-tag.txt
            verified-image/media-image-id.txt
            verified-image/media-image-sbom.json
          if-no-files-found: error
  generate:
    name: Generate dependency locks
    if: >-
      github.ref == 'refs/heads/security/ci-hardening' &&
      github.event_name == 'workflow_dispatch' && inputs.operation == 'dependency-locks'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate hashed Python lock
        run: |
          python -m pip install "uv==0.9.15"
          uv pip compile --generate-hashes --python-version 3.12 --output-file requirements-ci.txt requirements-ci.in
          uv pip compile --generate-hashes --python-version 3.12 --constraint requirements-ci.txt --output-file requirements-dev.txt requirements-dev.in
      - name: Generate Flutter lock
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check locked Python installation
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip check
      - name: Commit lockfiles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.txt requirements-ci.txt apps/mobile/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: generate reproducible Python and Flutter dependency locks"
            git push origin HEAD:security/ci-hardening
          fi
      - name: Upload resolved locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-locks
          path: |
            requirements-dev.txt
            requirements-ci.txt
            apps/mobile/pubspec.lock
          if-no-files-found: error
  verify:
    name: Environment security review
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'staging-security' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging-security-review
    permissions:
      contents: read
    concurrency:
      group: kolovibe-environment-security-review
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate approved environment configuration and credentials
        env:
          KOLOVIBE_STAGING_URL: ${{ vars.KOLOVIBE_STAGING_URL }}
          KOLOVIBE_STAGING_HOST: ${{ vars.KOLOVIBE_STAGING_HOST }}
          KOLOVIBE_STAGING_CHECK_PATH: ${{ vars.KOLOVIBE_STAGING_CHECK_PATH }}
          KOLOVIBE_STAGING_CHECK_TOKEN: ${{ secrets.KOLOVIBE_STAGING_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KOLOVIBE_STAGING_URL" || { echo "::error::Missing staging URL environment variable"; exit 1; }
          test -n "$KOLOVIBE_STAGING_HOST" || { echo "::error::Missing staging host environment variable"; exit 1; }
          test -n "$KOLOVIBE_STAGING_CHECK_PATH" || { echo "::error::Missing authenticated probe path environment variable"; exit 1; }
          test -n "$KOLOVIBE_STAGING_CHECK_TOKEN" || { echo "::error::Missing environment-scoped probe token"; exit 1; }
          python scripts/verify_staging.py
  identity-secrets:
    name: Validate protected identity secrets offline
    needs: [validate-dispatch]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'identity-secrets' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging-security-review
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked runtime
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Validate secret files without network or mail delivery
        env:
          KOLOVIBE_IDENTITY_DJANGO_KEY: ${{ secrets.KOLOVIBE_IDENTITY_DJANGO_KEY }}
          KOLOVIBE_IDENTITY_DB_PASSWORD: ${{ secrets.KOLOVIBE_IDENTITY_DB_PASSWORD }}
          KOLOVIBE_IDENTITY_DB_CA: ${{ secrets.KOLOVIBE_IDENTITY_DB_CA }}
          KOLOVIBE_IDENTITY_TLS_CERT: ${{ secrets.KOLOVIBE_IDENTITY_TLS_CERT }}
          KOLOVIBE_IDENTITY_TLS_KEY: ${{ secrets.KOLOVIBE_IDENTITY_TLS_KEY }}
          KOLOVIBE_INTERNAL_CA: ${{ secrets.KOLOVIBE_INTERNAL_CA }}
          KOLOVIBE_IDENTITY_CALLER_KEYS: ${{ secrets.KOLOVIBE_IDENTITY_CALLER_KEYS }}
          KOLOVIBE_IDENTITY_PROBE_TOKEN: ${{ secrets.KOLOVIBE_IDENTITY_PROBE_TOKEN }}
          KOLOVIBE_SMTP_USER: ${{ secrets.KOLOVIBE_SMTP_USER }}
          KOLOVIBE_SMTP_PASSWORD: ${{ secrets.KOLOVIBE_SMTP_PASSWORD }}
          KOLOVIBE_MFA_ENCRYPTION_KEY: ${{ secrets.KOLOVIBE_MFA_ENCRYPTION_KEY }}
          KOLOVIBE_IDENTITY_AUDIT_SIGNING_KEY: ${{ secrets.KOLOVIBE_IDENTITY_AUDIT_SIGNING_KEY }}
          KOLOVIBE_IDENTITY_AUDIT_PEERS: ${{ vars.KOLOVIBE_IDENTITY_AUDIT_PEERS }}
          KOLOVIBE_IDENTITY_APPROVALS: ${{ vars.KOLOVIBE_IDENTITY_APPROVALS }}
          KOLOVIBE_ALLOWED_HOSTS: ${{ vars.KOLOVIBE_IDENTITY_HOSTS }}
          KOLOVIBE_DB_NAME: ${{ vars.KOLOVIBE_DB_NAME }}
          KOLOVIBE_DB_HOST: ${{ vars.KOLOVIBE_DB_HOST }}
          KOLOVIBE_DB_USER: ${{ vars.KOLOVIBE_IDENTITY_DB_USER }}
          KOLOVIBE_DB_PORT: ${{ vars.KOLOVIBE_DB_PORT }}
          KOLOVIBE_SMTP_HOST: ${{ vars.KOLOVIBE_SMTP_HOST }}
          KOLOVIBE_SMTP_PORT: ${{ vars.KOLOVIBE_SMTP_PORT }}
          KOLOVIBE_FROM_EMAIL: ${{ vars.KOLOVIBE_FROM_EMAIL }}
        run: python scripts/validate_identity_secrets.py
