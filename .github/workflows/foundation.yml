name: Stage 3 foundation (no deployment)
on:
  push:
    branches: [main, 'stage3/**']
  pull_request:
permissions:
  contents: read
jobs:
  django-skeleton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_structure.py
      - run: python scripts/test_services.py
# Dependencies and actions must be digest/commit-pinned before FND-02 acceptance.
