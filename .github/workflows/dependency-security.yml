name: Dependency vulnerability review
on:
  push:
    branches: [main, 'feature/**', 'chore/**', 'fix/**', 'security/**']
  pull_request:
  schedule:
    - cron: '13 5 * * 1'
permissions:
  contents: read
  actions: read
  security-events: write
jobs:
  osv:
    name: Python and Flutter dependency advisories
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --lockfile=requirements.txt:requirements-dev.txt
        --lockfile=apps/mobile/pubspec.lock
    permissions:
      contents: read
      actions: read
      security-events: write
