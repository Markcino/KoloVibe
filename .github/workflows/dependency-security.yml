name: Dependency vulnerability review
on:
  push:
    branches: [main, 'feature/**', 'chore/**', 'fix/**', 'security/**']
  pull_request:
  schedule:
    - cron: '13 5 * * 1'
permissions:
  contents: read
jobs:
  osv:
    name: Python and Flutter dependency advisories
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --lockfile=requirements.txt:requirements-dev.txt
        --lockfile=apps/mobile_flutter/pubspec.lock
    permissions:
      contents: read
      actions: read
