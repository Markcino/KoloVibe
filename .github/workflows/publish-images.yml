name: Publish verified service images
on:
  workflow_run:
    workflows: [API quality, Container quality, Dependency vulnerability review]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ghcr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  gate:
    name: Verify exact-commit publication gates
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      sha: ${{ steps.gate.outputs.sha }}
      container_run: ${{ steps.gate.outputs.container_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ghcr_gate.py
  publish:
    name: Publish verified image / ${{ matrix.service }}
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, identity, creators, content, engagement, points, moderation, audit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the verified image from the gated container run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.gate.outputs.container_run }}
          name: verified-image-${{ matrix.service }}-${{ needs.gate.outputs.sha }}
          path: verified-image
      - name: Verify and load the exact tested image
        env:
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_image_artifact.py verified-image --service "$SERVICE" --revision "$REVISION"
          docker load --input verified-image/image.tar
          IMAGE="kolovibe/$SERVICE:ci"
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
      - name: Authenticate and publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE: ${{ matrix.service }}
          REVISION: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          REPOSITORY="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_ID="$(cat verified-image/image-id.txt)"
          TARGET="ghcr.io/$REPOSITORY/$SERVICE:$REVISION-${IMAGE_ID#sha256:}"
          docker tag "kolovibe/$SERVICE:ci" "$TARGET"
          docker push "$TARGET"
          docker pull "$TARGET"
          test "$(docker image inspect "$TARGET" --format '{{.Id}}')" = "$(cat verified-image/image-id.txt)"
          DIGEST="$(docker image inspect "$TARGET" --format '{{index .RepoDigests 0}}')"
          printf '%s\n' "$DIGEST" | grep -Eq "^ghcr.io/$REPOSITORY/$SERVICE@sha256:[0-9a-f]{64}$"
          printf '%s\n' "$DIGEST" > verified-image/published-digest.txt
          printf '%s\n' "$TARGET" > verified-image/published-tag.txt
          printf '### %s\n\nCommit: `%s`\n\nImage: `%s`\n' "$SERVICE" "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-image-${{ matrix.service }}-${{ needs.gate.outputs.sha }}
          path: |
            verified-image/published-digest.txt
            verified-image/published-tag.txt
            verified-image/image-id.txt
            verified-image/revision.txt
            verified-image/service.txt
            verified-image/image-sbom.json
          if-no-files-found: error
