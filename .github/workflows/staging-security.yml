name: Environment security review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging-security-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check approved environment endpoint
        env:
          KOLOVIBE_STAGING_URL: ${{ vars.KOLOVIBE_STAGING_URL }}
          KOLOVIBE_STAGING_HOST: ${{ vars.KOLOVIBE_STAGING_HOST }}
        run: python scripts/verify_staging.py
