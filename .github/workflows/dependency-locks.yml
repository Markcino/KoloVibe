name: Dependency locks
on:
  push:
    branches: ['security/ci-hardening']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate hashed Python lock
        run: |
          python -m pip install "uv==0.9.15"
          uv pip compile --generate-hashes --python-version 3.12 --output-file requirements-dev.txt requirements-dev.in
          uv pip compile --generate-hashes --python-version 3.12 --output-file requirements-ci.txt requirements-ci.in
      - name: Generate Flutter lock
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: apps/mobile_flutter
        run: flutter pub get
      - name: Check locked Python installation
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip check
      - name: Commit lockfiles to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.txt requirements-ci.txt apps/mobile_flutter/pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: generate reproducible Python and Flutter dependency locks"
            git push origin HEAD:security/ci-hardening
          fi
      - name: Upload resolved locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-locks
          path: |
            requirements-dev.txt
            requirements-ci.txt
            apps/mobile_flutter/pubspec.lock
          if-no-files-found: error
# This workflow is intentionally restricted to the dedicated lock branch.
# Its push uses GITHUB_TOKEN, so subsequent CI must be manually verified after the generated commit.
