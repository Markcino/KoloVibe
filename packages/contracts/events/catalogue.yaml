legacy_gaps:
- source: services/points/service/events.py
  issue: 305
  detail: Generic local/foundation events publish via default Celery exchange; not an approved cross-service domain
    contract. Only documented qualified-view input may cause Points awards. Migration to named exchanges requires
    reviewed runtime work.
- source: services/points/service/celery_app.py
  issue: 311
  detail: max_retries=None for DB errors; current consumers do not implement proposed bounded DLQ policy. No runtime
    claim.
- source: services/engagement/service/events.py
  issue: 305
  detail: Non-qualified/non-privacy events loop to own queue; generic foundation handler records receipt. Not a
    domain catalogue authorization.
