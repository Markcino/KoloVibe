version: 1.1.0-review
status: 'REVIEW REQUIRED #305/#141/#140'
canonical_openapi: docs/architecture/DOC-205_OpenAPI_3_1_DRAFT.yaml
transport:
  broker: RabbitMQ
  format: Celery JSON only; never pickle
  legacy_envelope: Celery positional args [event_id UUID, event_type string, payload object]; task_id=event_id;
    delivery_mode=2
  target_envelope: Versioned domain envelope defined below; no change to legacy wire format without reviewed migration
  guarantees: At least once; outbox+business effect atomic; confirm publish; inbox+effect+outbox atomic; ACK after
    commit. External provider delivery is not exactly once.
  security: TLS with CA verification, per-producer write-only exchange ACLs; per-consumer own-queue read ACL; payload
    producer field is not authentication. Target domain events require producer signature over canonical envelope,
    audience, body digest, timestamp and key id. Key rotation overlaps are approved, no default exchange grants.
  replay: 'Dedupe by producer/event id and digest. Same id with changed type/payload rejected as integrity conflict.
    Unknown version/source/kind rejected; quarantine malformed poison messages with no payload logging. Retry only
    transient failures; bounded policy and administrator-only replay through normal publisher. Retry/DLQ deployment
    remains #311, not claimed built.'
  ordering: No global ordering. Aggregate id + monotonic version in target events; ignore verified stale versions,
    detect gaps, request owner snapshot/reconciliation; no out-of-order financial posting from unverified facts.
  privacy: Ids-only domain facts; no addresses, text, credentials, tokens, QR payloads or card/bank fields. Existing
    privacy.export_delivered is an explicit sensitive-data exception with restricted Identity queue and per-category
    export allowlists; not an ids-only notification feed.
